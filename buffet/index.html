<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="회사 근처 역을 고르면 그 근처 한식뷔페의 오늘 메뉴를 사진과 글로 볼 수 있는 게시판. 역에서 걸어서 몇 분인지도 함께 보여 줍니다.">
<meta name="theme-color" content="#3b2519">
<link rel="canonical" href="https://ella16.github.io/buffet/">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>오늘 한식뷔페 메뉴</title>
<script src="config.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&display=swap" rel="stylesheet">
<style>
  /* 한식당 메뉴판: 쌀종이 바탕, 나무 간판, 고추장 빨강, 나물 초록 */
  :root {
    --bg: #f6eddf; --paper: #fffaf2; --ink: #2b1d14; --muted: #8a7461; --line: #e7d5bd;
    --red: #b3261e; --red-ink: #fffaf2; --red-soft: #f8e2d9; --green: #3f6b35; --green-soft: #e3ecd6;
    --gold: #d79a2b; --wood: #3b2519; --wood-ink: #fbf1e3; --wood-muted: #cdb497;
    --shadow: 0 1px 0 rgba(80,50,20,.05), 0 6px 18px rgba(80,50,20,.08);
    --serif: "Gowun Batang", "Nanum Myeongjo", "AppleMyungjo", serif;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #17110d; --paper: #211812; --ink: #f3e8da; --muted: #b29d88; --line: #3b2c21;
      --red: #e4644b; --red-ink: #1a110c; --red-soft: #3d221a; --green: #9cc585; --green-soft: #26321f;
      --gold: #e8b45a; --wood: #0e0907; --wood-ink: #f3e8da; --wood-muted: #a8927b; --shadow: 0 1px 0 rgba(0,0,0,.4);
    }
  }
  :root[data-theme="dark"] {
    --bg: #17110d; --paper: #211812; --ink: #f3e8da; --muted: #b29d88; --line: #3b2c21;
    --red: #e4644b; --red-ink: #1a110c; --red-soft: #3d221a; --green: #9cc585; --green-soft: #26321f;
    --gold: #e8b45a; --wood: #0e0907; --wood-ink: #f3e8da; --wood-muted: #a8927b; --shadow: 0 1px 0 rgba(0,0,0,.4);
  }
  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    margin: 0; color: var(--ink); font: 16px/1.55 system-ui, -apple-system, "Apple SD Gothic Neo", "Noto Sans KR", sans-serif;
    background-color: var(--bg);
    background-image: radial-gradient(rgba(120,80,40,.06) 1px, transparent 1px);
    background-size: 14px 14px;
  }
  button, input, textarea, select { font: inherit; color: inherit; }
  .wrap { max-width: 640px; margin: 0 auto; padding: 0 16px calc(100px + env(safe-area-inset-bottom)); }

  /* 나무 간판 머리말 — 화면 끝까지 */
  header {
    position: sticky; top: 0; z-index: 5; color: var(--wood-ink); background: var(--wood);
    box-shadow: 0 0 0 100vmax var(--wood); clip-path: inset(0 -100vmax);
    padding: calc(14px + env(safe-area-inset-top)) 0 0;
  }
  .title { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
  .eyebrow { margin: 0; font-size: 11px; letter-spacing: .22em; color: var(--gold); font-weight: 700; }
  h1 { margin: 0; font: 700 23px/1.25 var(--serif); letter-spacing: -0.01em; }
  .sub { color: var(--wood-muted); font-size: 13px; margin: 2px 0 0; }
  .station-btn { display: inline-flex; align-items: center; gap: 4px; border: 1px solid rgba(255,240,220,.35); background: rgba(255,240,220,.08); color: var(--wood-ink); border-radius: 999px; padding: 7px 13px; font-weight: 700; cursor: pointer; font-size: 15px; white-space: nowrap; }
  .station-btn:hover { background: rgba(255,240,220,.16); }
  nav { display: flex; gap: 4px; margin-top: 10px; }
  nav button { background: none; border: 0; padding: 10px 12px 11px; font-weight: 700; color: var(--wood-muted); border-bottom: 3px solid transparent; cursor: pointer; }
  nav button[aria-selected="true"] { color: var(--wood-ink); border-bottom-color: var(--gold); }
  main { padding-top: 18px; min-height: calc(100vh - 120px); min-height: calc(100dvh - 120px); }

  /* 뷔페 하나 = 메뉴판 한 장 */
  .buffet { background: var(--paper); border: 1px solid var(--line); border-radius: 18px; box-shadow: var(--shadow); margin: 0 0 18px; overflow: hidden; }
  .bhead { display: flex; justify-content: space-between; align-items: flex-start; gap: 10px; padding: 16px 16px 12px; border-bottom: 2px solid var(--ink); margin: 0 14px; padding-left: 2px; padding-right: 2px; }
  .bhead h2 { margin: 0 0 4px; font: 700 21px/1.3 var(--serif); overflow-wrap: anywhere; }
  .walk { display: inline-block; background: var(--green-soft); color: var(--green); border-radius: 999px; padding: 1px 9px; font-size: 13px; font-weight: 800; margin-right: 6px; white-space: nowrap; }
  .addr { color: var(--muted); font-size: 13px; overflow-wrap: anywhere; }
  .tiny { font-size: 12px; color: var(--muted); background: none; border: 0; cursor: pointer; padding: 4px; text-decoration: underline; white-space: nowrap; }
  .none { margin: 12px 16px 16px; border: 1px dashed var(--line); border-radius: 12px; padding: 14px; color: var(--muted); font-size: 14px; display: flex; justify-content: space-between; align-items: center; gap: 10px; }

  /* 글 한 개 */
  .card { padding: 14px 16px 6px; }
  .card .body { padding: 0; }
  .card + .card { border-top: 1px dashed var(--line); }
  .card img.photo { display: block; width: 100%; max-height: 380px; object-fit: cover; border-radius: 12px; background: var(--line); margin-bottom: 12px; }
  .meta { display: flex; justify-content: space-between; gap: 8px; color: var(--muted); font-size: 13px; }
  .meta b { color: var(--ink); font-weight: 700; }
  .label { font-size: 11px; letter-spacing: .2em; color: var(--red); font-weight: 800; margin: 12px 0 4px; }
  ul.menu { list-style: none; padding: 0; margin: 0 0 8px; display: grid; grid-template-columns: 1fr 1fr; gap: 3px 16px; }
  ul.menu li { font: 400 17px/1.5 var(--serif); overflow-wrap: anywhere; padding-left: 14px; position: relative; }
  ul.menu li::before { content: ""; position: absolute; left: 1px; top: .72em; width: 5px; height: 5px; border-radius: 50%; background: var(--red); }
  .price { display: inline-block; margin: 4px 0 0; color: var(--red); border: 2px solid var(--red); border-radius: 6px; padding: 0 8px; font-weight: 800; font-size: 15px; transform: rotate(-2deg); }
  .note { margin: 10px 0 0; white-space: pre-wrap; overflow-wrap: anywhere; border-left: 3px solid var(--gold); padding: 2px 0 2px 10px; color: var(--ink); }
  .actions { display: flex; gap: 6px; padding: 10px 0 10px; flex-wrap: wrap; }
  .chip { display: inline-flex; align-items: center; gap: 5px; border: 1px solid var(--line); background: var(--paper); border-radius: 999px; padding: 6px 13px; font-size: 14px; cursor: pointer; min-height: 36px; }
  .chip:hover { border-color: var(--muted); }
  .chip[aria-pressed="true"] { background: var(--red-soft); border-color: var(--red); color: var(--red); font-weight: 700; }
  .chip.quiet { border-color: transparent; color: var(--muted); margin-left: auto; }
  .chip.danger { color: var(--red); border-color: var(--red); }
  .comments { margin: 0 -16px; border-top: 1px solid var(--line); padding: 10px 16px 14px; background: var(--bg); }
  .comment { padding: 6px 0; border-bottom: 1px dashed var(--line); font-size: 15px; overflow-wrap: anywhere; white-space: pre-wrap; }
  .comment:last-of-type { border-bottom: 0; }
  .comment .who { font-weight: 700; margin-right: 6px; }
  .comment .when { color: var(--muted); font-size: 12px; margin-left: 6px; }
  .cform { display: grid; grid-template-columns: 90px 1fr auto; gap: 6px; margin-top: 8px; }

  input, textarea, select { width: 100%; border: 1px solid var(--line); background: var(--paper); border-radius: 10px; padding: 10px 12px; min-width: 0; }
  input:focus, textarea:focus, select:focus { outline: 2px solid var(--red); outline-offset: -1px; }
  .btn { border: 0; background: var(--red); color: var(--red-ink); font-weight: 800; border-radius: 12px; padding: 10px 18px; cursor: pointer; }
  .btn:disabled { opacity: .55; cursor: default; }
  .btn.ghost { background: var(--paper); color: var(--ink); border: 1px solid var(--line); }
  .addbuffet { width: 100%; padding: 14px; border-style: dashed; }
  .empty { text-align: center; color: var(--muted); padding: 40px 16px; background: var(--paper); border: 1px solid var(--line); border-radius: 18px; }
  .empty::before { content: "🍚"; display: block; font-size: 44px; margin-bottom: 6px; }
  .empty strong { display: block; color: var(--ink); font: 700 19px/1.4 var(--serif); margin-bottom: 6px; }
  .fab { position: fixed; right: max(16px, calc(50vw - 304px)); bottom: calc(20px + env(safe-area-inset-bottom)); z-index: 6; box-shadow: 0 8px 22px rgba(179,38,30,.38); border-radius: 999px; padding: 15px 22px; font-size: 16px; }
  .days { list-style: none; margin: 0; padding: 0; }
  .days button { width: 100%; text-align: left; background: var(--paper); border: 1px solid var(--line); border-radius: 12px; padding: 14px 16px; margin-bottom: 8px; cursor: pointer; display: flex; justify-content: space-between; font: 700 16px var(--serif); }
  .back { margin-bottom: 12px; }
  .hint { font-size: 13px; color: var(--muted); margin: 0; }
  .dayhead { margin: 0 0 12px; font: 700 19px var(--serif); }

  dialog { border: 0; border-radius: 20px; padding: 0; width: min(560px, calc(100vw - 24px)); background: var(--paper); color: var(--ink); box-shadow: 0 24px 60px rgba(0,0,0,.35); }
  dialog::backdrop { background: rgba(30,18,10,.55); }
  dialog form { padding: 20px 18px 16px; display: grid; gap: 12px; }
  dialog h2 { margin: 0; font: 700 21px/1.3 var(--serif); }
  label { display: grid; gap: 5px; font-size: 14px; font-weight: 700; }
  label small { font-weight: 400; color: var(--muted); }
  .row { display: flex; gap: 8px; justify-content: flex-end; }
  .preview { position: relative; }
  .preview img { width: 100%; max-height: 220px; object-fit: cover; border-radius: 10px; display: block; }
  .preview button { position: absolute; top: 6px; right: 6px; }
  .err { color: var(--red); font-size: 14px; min-height: 1em; margin: 0; }
  .picker-search { position: sticky; top: 0; background: var(--paper); padding-bottom: 8px; }
  .picker-list { max-height: 60vh; overflow: auto; }
  .picker-list h3 { font-size: 12px; letter-spacing: .08em; color: var(--muted); margin: 12px 0 6px; }
  .picker-list .grid { display: flex; flex-wrap: wrap; gap: 6px; }
  .picker-list .chip[aria-current="true"] { background: var(--red); color: var(--red-ink); border-color: var(--red); }

  .toast { position: fixed; left: 50%; bottom: calc(92px + env(safe-area-inset-bottom)); transform: translateX(-50%); background: var(--wood); color: var(--wood-ink); padding: 10px 16px; border-radius: 12px; font-size: 14px; z-index: 20; max-width: calc(100vw - 32px); box-shadow: 0 6px 20px rgba(0,0,0,.25); }
  footer { color: var(--muted); font-size: 12px; text-align: center; padding: 24px 0 0; }
  footer button { background: none; border: 0; color: inherit; text-decoration: underline; cursor: pointer; font-size: 12px; }
  .admin-bar { background: var(--red); color: var(--red-ink); border-radius: 12px; padding: 8px 12px; font-size: 14px; display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
  .admin-bar button { background: rgba(255,255,255,.2); color: inherit; border: 0; border-radius: 8px; padding: 4px 10px; cursor: pointer; }
  .hidden-tag { background: var(--red); color: var(--red-ink); font: 700 12px system-ui, sans-serif; border-radius: 6px; padding: 1px 6px; margin-left: 6px; vertical-align: middle; }
  .skeleton { height: 160px; border-radius: 18px; background: var(--paper); border: 1px solid var(--line); margin-bottom: 14px; animation: pulse 1.2s ease-in-out infinite; }
  @keyframes pulse { 50% { opacity: .5; } }
  @media (prefers-reduced-motion: reduce) { .skeleton { animation: none; } }
  .ad { margin: 18px 0 0; text-align: center; }
  .ad .slot { display: flex; justify-content: center; min-height: 140px; }
  .ad iframe { border: 0; max-width: 100%; border-radius: 10px; }
  .ad p { font-size: 11px; color: var(--muted); margin: 6px 0 0; }
  @media (max-width: 360px) { ul.menu { grid-template-columns: 1fr; } }
</style>

</head>
<body>
<div class="wrap">
  <header>
    <div class="title">
      <div><p class="eyebrow">TODAY'S MENU</p><h1 id="shop"></h1><p class="sub" id="todayLabel"></p></div>
      <button class="station-btn" id="stationBtn" type="button" aria-haspopup="dialog">📍 <span id="stationName">역 고르기</span> ▾</button>
    </div>
    <nav role="tablist">
      <button role="tab" id="tabToday" aria-selected="true">오늘 메뉴</button>
      <button role="tab" id="tabPast" aria-selected="false">지난 7일</button>
    </nav>
  </header>
  <main id="main" aria-live="polite"></main>
  <aside class="ad" id="ad" hidden>
    <div class="slot" id="adSlot"></div>
    <p>이 페이지의 일부 링크는 쿠팡 파트너스 활동의 일환으로, 구매 시 일정액의 수수료를 제공받을 수 있습니다.</p>
  </aside>
  <footer>
    누구나 올리는 게시판이에요. 이상한 글은 신고해 주세요 (신고 3건이면 숨겨져요).<br>
    메뉴는 7일 동안만 보이고 그 뒤에는 지워져요. 도보 시간은 지도 길찾기로 잰 어림값이에요.<br>
    <button id="adminLink" type="button">관리</button>
  </footer>
</div>
<button class="btn fab" id="writeBtn" type="button" hidden>＋ 오늘 메뉴 올리기</button>

<dialog id="stationDlg">
  <form method="dialog" id="stationForm">
    <h2>어느 역 근처에서 드세요?</h2>
    <div class="picker-search"><input id="stationSearch" type="search" placeholder="역 이름 찾기 (예: 역삼)" aria-label="역 이름 찾기" autocomplete="off"></div>
    <div class="picker-list" id="stationList"></div>
    <div class="row"><button class="btn ghost" type="button" id="cancelStation">닫기</button></div>
  </form>
</dialog>

<dialog id="buffetDlg">
  <form id="buffetForm" novalidate>
    <h2>뷔페 추가 · <span id="buffetStation"></span></h2>
    <label>뷔페 이름<input name="name" maxlength="30" required placeholder="예: 테헤란 한식뷔페"></label>
    <label>주소 <small>도로명 주소가 가장 잘 찾아져요</small><input name="address" maxlength="100" required placeholder="예: 서울 강남구 테헤란로 123"></label>
    <label id="walkWrap" hidden>역에서 걸어서 몇 분? <small>주소로 못 찾았을 때만 적어 주세요</small><input name="walkMin" type="number" inputmode="numeric" min="1" max="40" placeholder="예: 5"></label>
    <p class="hint">주소를 넣으면 역에서 걸어서 몇 분인지 자동으로 재요.</p>
    <p class="err" id="buffetErr"></p>
    <div class="row"><button class="btn ghost" type="button" id="cancelBuffet">취소</button><button class="btn" type="submit" id="submitBuffet">추가</button></div>
  </form>
</dialog>

<dialog id="writeDlg">
  <form id="writeForm" novalidate>
    <h2>오늘 메뉴 올리기</h2>
    <label>어느 뷔페?<select name="buffetId" required></select></label>
    <label>메뉴 <small>한 줄에 하나씩</small>
      <textarea name="menu" rows="6" maxlength="1200" placeholder="제육볶음&#10;잡채&#10;계란말이&#10;미역국" required></textarea></label>
    <label>사진 <small>(선택) 위치 정보는 지워서 올라가요</small>
      <input type="file" name="photo" accept="image/*"></label>
    <div class="preview" id="preview" hidden><img alt="올릴 사진 미리 보기"><button type="button" class="chip" id="rmPhoto">사진 빼기</button></div>
    <label>가격 <small>(선택)</small><input name="price" maxlength="30" placeholder="예: 9,000원"></label>
    <label>한마디 <small>(선택)</small><textarea name="note" rows="2" maxlength="300" placeholder="오늘 제육 맛있어요!"></textarea></label>
    <label>별명<input name="nick" maxlength="20" required autocomplete="nickname"></label>
    <p class="err" id="writeErr"></p>
    <div class="row"><button class="btn ghost" type="button" id="cancelWrite">취소</button><button class="btn" type="submit" id="submitWrite">올리기</button></div>
  </form>
</dialog>

<dialog id="adminDlg">
  <form id="adminForm">
    <h2>관리자</h2>
    <label>비밀번호<input type="password" name="pw" autocomplete="current-password" required></label>
    <p class="err" id="adminErr"></p>
    <div class="row"><button class="btn ghost" type="button" id="cancelAdmin">취소</button><button class="btn" type="submit">들어가기</button></div>
  </form>
</dialog>
<script>
(() => {
  'use strict';
  const CFG = window.BUFFET_CONFIG || {};
  const API = String(CFG.apiBase || '').replace(/\/+$/, '');
  const APP = CFG.name || '오늘 한식뷔페 메뉴';
  const $ = s => document.querySelector(s);
  const main = $('#main');

  // 화면에 넣는 글은 모두 textContent 로만 넣는다 (스크립트가 든 글도 글자로만 보이게).
  function el(tag, attrs, ...kids) {
    const n = document.createElement(tag);
    for (const [k, v] of Object.entries(attrs || {})) {
      if (v == null || v === false) continue;
      if (k === 'class') n.className = v;
      else if (k === 'text') n.textContent = v;
      else if (k.startsWith('on')) n.addEventListener(k.slice(2), v);
      else n.setAttribute(k, v === true ? '' : v);
    }
    for (const c of kids.flat()) if (c != null) n.append(c instanceof Node ? c : document.createTextNode(String(c)));
    return n;
  }
  const store = {
    get(k, d) { try { const v = localStorage.getItem(k); return v == null ? d : JSON.parse(v); } catch { return d; } },
    set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} },
  };
  const ss = {
    get(k) { try { return sessionStorage.getItem(k); } catch { return null; } },
    set(k, v) { try { v == null ? sessionStorage.removeItem(k) : sessionStorage.setItem(k, v); } catch {} },
  };
  let cid = store.get('buffet-cid', null);
  if (!cid || !/^[A-Za-z0-9_-]{16,64}$/.test(cid)) {
    const a = new Uint8Array(18); crypto.getRandomValues(a);
    cid = btoa(String.fromCharCode(...a)).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
    store.set('buffet-cid', cid);
  }
  const liked = new Set(store.get('buffet-liked', []));
  const reported = new Set(store.get('buffet-reported', []));
  const remember = (set, key) => store.set(key, [...set].slice(-300));

  const kstToday = () => new Intl.DateTimeFormat('en-CA', { timeZone: 'Asia/Seoul', year: 'numeric', month: '2-digit', day: '2-digit' }).format(new Date());
  const WD = ['일', '월', '화', '수', '목', '금', '토'];
  function prettyDate(d) {
    const [y, m, dd] = d.split('-').map(Number);
    return `${m}월 ${dd}일 (${WD[new Date(Date.UTC(y, m - 1, dd)).getUTCDay()]})`;
  }
  const prettyTime = ms => new Intl.DateTimeFormat('ko-KR', { timeZone: 'Asia/Seoul', hour: 'numeric', minute: '2-digit' }).format(new Date(ms));
  let toastTimer;
  function toast(msg) {
    document.querySelectorAll('.toast').forEach(t => t.remove());
    const t = el('div', { class: 'toast', role: 'status', text: msg });
    document.body.append(t);
    clearTimeout(toastTimer); toastTimer = setTimeout(() => t.remove(), 3000);
  }

  let bust = 0; // 내가 방금 쓴 것을 바로 보려고 캐시를 건너뛸 때 쓴다
  async function api(path, body) {
    const opt = body === undefined ? { headers: {} } : { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) };
    opt.headers['X-Client-Id'] = cid;
    let res;
    try { res = await fetch(API + '/api/' + path, opt); }
    catch { throw new Error('인터넷 연결을 확인해 주세요'); }
    let data = null; try { data = await res.json(); } catch {}
    if (!res.ok) { const e = new Error((data && data.error) || '잠시 뒤 다시 해 주세요'); e.code = data && data.code; throw e; }
    return data;
  }

  // ── 상태 ─────────────────────────────────
  let stations = store.get('buffet-stations', []);
  const qs = new URLSearchParams(location.search).get('s');
  let station = qs || store.get('buffet-station', null);
  let view = 'today';        // today | past | day
  let viewDate = kstToday();
  let admin = ss.get('buffet-admin');
  const openComments = new Set();
  let lastDay = null;
  const stationName = id => (stations.find(s => s.id === id) || {}).name || '';

  $('#shop').textContent = APP;
  document.title = APP;

  function setStation(id) {
    station = id;
    store.set('buffet-station', id);
    const u = new URL(location.href); u.searchParams.set('s', id); history.replaceState(null, '', u);
    lastDay = null;
  }

  // ── 역 고르기 ─────────────────────────────
  const sdlg = $('#stationDlg');
  function drawStations(filter) {
    const f = (filter || '').replace(/\s|역$/g, '');
    const list = $('#stationList'); list.replaceChildren();
    const areas = new Map();
    for (const s of stations) {
      if (f && !s.name.replace(/역$/, '').includes(f)) continue;
      if (!areas.has(s.area)) areas.set(s.area, []);
      areas.get(s.area).push(s);
    }
    if (!areas.size) list.append(el('p', { class: 'hint', text: '찾는 역이 없어요. 아래 "관리"로 알려 주시면 추가할게요.' }));
    for (const [area, ss2] of areas) list.append(el('h3', { text: area }), el('div', { class: 'grid' }, ss2.map(s =>
      el('button', { class: 'chip', type: 'button', 'aria-current': s.id === station ? 'true' : null, onclick: () => { setStation(s.id); sdlg.close(); view = 'today'; render(); } }, s.name))));
  }
  function openStations() { $('#stationSearch').value = ''; drawStations(''); sdlg.showModal(); }
  $('#stationBtn').onclick = openStations;
  $('#cancelStation').onclick = () => sdlg.close();
  $('#stationSearch').oninput = e => drawStations(e.target.value);

  // ── 그리기 ───────────────────────────────
  function skeleton() { main.replaceChildren(el('div', { class: 'skeleton' }), el('div', { class: 'skeleton' })); }
  function adminBar() {
    if (!admin) return null;
    return el('div', { class: 'admin-bar' }, '관리자 모드 · 숨겨진 것도 보여요',
      el('button', { type: 'button', text: '나가기', onclick: () => { admin = null; ss.set('buffet-admin', null); render(); } }));
  }
  const walkText = b => b.via === 'manual' ? `도보 약 ${b.walkMin}분` : `도보 ${b.walkMin}분`;

  function postCard(p, date) {
    const isOpen = openComments.has(p.id);
    const ref = { date, station, postId: p.id };
    const likeBtn = el('button', { class: 'chip', type: 'button', 'aria-pressed': liked.has(p.id) ? 'true' : 'false',
      onclick: async e => {
        if (liked.has(p.id)) return;
        const b = e.currentTarget; b.disabled = true;
        try { await api('like', ref); liked.add(p.id); remember(liked, 'buffet-liked'); bust = Date.now(); p.likes++; b.setAttribute('aria-pressed', 'true'); b.lastChild.textContent = ' ' + p.likes; }
        catch (err) { toast(err.message); } finally { b.disabled = false; }
      } }, '😋 맛있어요', el('span', { text: ' ' + p.likes }));
    const cBtn = el('button', { class: 'chip', type: 'button', 'aria-expanded': String(isOpen),
      onclick: () => { isOpen ? openComments.delete(p.id) : openComments.add(p.id); render('local'); } }, '💬 댓글 ' + p.comments.length);
    const repBtn = el('button', { class: 'chip quiet', type: 'button', disabled: reported.has(p.id) || null,
      onclick: async () => {
        if (!confirm('이 글을 신고할까요? 신고가 3건 쌓이면 글이 숨겨져요.')) return;
        try { await api('report', ref); reported.add(p.id); remember(reported, 'buffet-reported'); bust = Date.now(); toast('신고했어요'); render(); }
        catch (err) { toast(err.message); }
      } }, reported.has(p.id) ? '신고함' : '신고');
    const actions = el('div', { class: 'actions' }, likeBtn, cBtn,
      admin ? el('button', { class: 'chip danger', type: 'button', onclick: () => adminDo({ action: 'deletePost', ...ref }, '이 글을 지울까요? 되돌릴 수 없어요.') }, '글 삭제') : repBtn);

    const card = el('article', { class: 'card' },
      p.photo ? el('img', { class: 'photo', src: p.photo, alt: '메뉴 사진', loading: 'lazy', decoding: 'async' }) : null,
      el('div', { class: 'body' },
        el('div', { class: 'meta' }, el('span', {}, el('b', { text: p.nick }), ' 님이 올림', p.hidden ? el('span', { class: 'hidden-tag', text: `숨김 · 신고 ${p.reports}` }) : null), el('span', { text: prettyTime(p.at) })),
        el('p', { class: 'label', text: '오늘의 반찬' }),
        el('ul', { class: 'menu', 'aria-label': '메뉴' }, p.menu.map(m => el('li', { text: m }))),
        p.price ? el('p', { class: 'price', text: p.price }) : null,
        p.note ? el('p', { class: 'note', text: p.note }) : null),
      actions);

    if (isOpen) {
      const box = el('div', { class: 'comments' });
      if (!p.comments.length) box.append(el('div', { class: 'comment', text: '아직 댓글이 없어요.' }));
      for (const c of p.comments) {
        box.append(el('div', { class: 'comment' }, el('span', { class: 'who', text: c.nick }), c.text, el('span', { class: 'when', text: prettyTime(c.at) }),
          admin ? el('button', { class: 'chip danger', type: 'button', style: 'margin-left:8px;min-height:28px;padding:2px 8px',
            onclick: () => adminDo({ action: 'deleteComment', ...ref, commentKey: c.key }, '이 댓글을 지울까요?') }, '삭제') : null));
      }
      const nick = el('input', { name: 'nick', maxlength: '20', placeholder: '별명', 'aria-label': '별명', value: store.get('buffet-nick', '') });
      const text = el('input', { name: 'text', maxlength: '200', placeholder: '댓글 달기', 'aria-label': '댓글' });
      const send = el('button', { class: 'btn', type: 'submit', text: '달기' });
      box.append(el('form', { class: 'cform', onsubmit: async e => {
        e.preventDefault();
        if (!nick.value.trim()) return nick.focus();
        if (!text.value.trim()) return text.focus();
        send.disabled = true;
        try { await api('comment', { ...ref, nick: nick.value, text: text.value }); store.set('buffet-nick', nick.value.trim()); bust = Date.now(); render(true); }
        catch (err) { toast(err.message); send.disabled = false; }
      } }, nick, text, send));
      card.append(box);
    }
    return card;
  }

  function buffetSection(b, posts, date, isToday) {
    const head = el('div', { class: 'bhead' },
      el('div', {},
        el('h2', {}, b.name, b.hidden ? el('span', { class: 'hidden-tag', text: `숨김 · 신고 ${b.reports}` }) : null),
        el('div', { class: 'addr' }, el('span', { class: 'walk', text: '🚶 ' + walkText(b) }), b.address)),
      admin ? el('button', { class: 'tiny', type: 'button', onclick: () => adminDo({ action: 'deleteBuffet', station, buffetId: b.id }, `'${b.name}' 뷔페를 지울까요?`) }, '뷔페 삭제')
            : el('button', { class: 'tiny', type: 'button', disabled: reported.has('b:' + b.id) || null, onclick: async () => {
                if (!confirm(`'${b.name}'을(를) 신고할까요? 없는 가게나 엉뚱한 글이면 신고해 주세요. 3건이면 숨겨져요.`)) return;
                try { await api('reportBuffet', { station, buffetId: b.id }); reported.add('b:' + b.id); remember(reported, 'buffet-reported'); bust = Date.now(); toast('신고했어요'); render(); }
                catch (err) { toast(err.message); }
              } }, reported.has('b:' + b.id) ? '신고함' : '신고'));
    const sec = el('section', { class: 'buffet' }, head);
    if (posts.length) sec.append(...posts.map(p => postCard(p, date)));
    else sec.append(el('div', { class: 'none' }, isToday ? '아직 오늘 메뉴가 없어요' : '이 날 올라온 메뉴가 없어요',
      isToday ? el('button', { class: 'chip', type: 'button', onclick: () => openWrite(b.id) }, '메뉴 올리기') : null));
    return sec;
  }

  async function renderDay(date, keep) {
    if (keep !== 'local') skeleton();
    let data;
    try {
      data = keep === 'local' && lastDay && lastDay.date === date && lastDay.station === station ? lastDay
        : admin ? await api('admin', { password: admin, action: 'list', station, date })
        : await api(`day?station=${encodeURIComponent(station)}&date=${date}` + (bust ? '&t=' + bust : ''));
    } catch (err) {
      if (admin && /비밀번호/.test(err.message)) { admin = null; ss.set('buffet-admin', null); }
      main.replaceChildren(el('div', { class: 'empty' }, el('strong', { text: '메뉴를 불러오지 못했어요' }), err.message,
        el('div', { style: 'margin-top:14px' }, el('button', { class: 'btn', type: 'button', text: '다시 시도', onclick: () => render() }))));
      return;
    }
    lastDay = data;
    const isToday = date === kstToday();
    const kids = [adminBar()];
    if (view === 'day') kids.push(el('button', { class: 'chip back', type: 'button', onclick: () => { view = 'past'; render(); } }, '← 날짜 목록'),
      el('h2', { class: 'dayhead', text: prettyDate(date) + ' 메뉴' }));
    const byBuffet = new Map(data.buffets.map(b => [b.id, []]));
    for (const p of data.posts) if (byBuffet.has(p.buffetId)) byBuffet.get(p.buffetId).push(p);
    if (!data.buffets.length) {
      kids.push(el('div', { class: 'empty' }, el('strong', { text: `${stationName(station)} 근처 뷔페가 아직 없어요` }),
        '아는 한식뷔페가 있으면 추가해 주세요.', el('div', { style: 'margin-top:14px' }, el('button', { class: 'btn', type: 'button', onclick: openBuffet }, '＋ 뷔페 추가'))));
    } else {
      // 오늘 메뉴가 올라온 곳을 먼저, 그다음은 가까운 순
      const order = [...data.buffets].sort((a, b) => (byBuffet.get(b.id).length > 0) - (byBuffet.get(a.id).length > 0) || a.walkMin - b.walkMin);
      kids.push(...order.map(b => buffetSection(b, byBuffet.get(b.id), date, isToday)));
      if (isToday) kids.push(el('button', { class: 'btn ghost addbuffet', type: 'button', onclick: openBuffet }, `＋ ${stationName(station)} 근처 뷔페 추가`));
    }
    main.replaceChildren(...kids.filter(Boolean));
  }

  async function renderPast() {
    let data;
    try { data = await api('days'); } catch (err) { main.replaceChildren(el('div', { class: 'empty' }, el('strong', { text: '목록을 불러오지 못했어요' }), err.message)); return; }
    const dates = data.dates.filter(d => d !== data.today);
    main.replaceChildren(...[adminBar(),
      el('p', { class: 'hint', style: 'margin:0 0 10px', text: `${stationName(station)} · 지난 메뉴는 7일까지만 볼 수 있어요` }),
      el('ul', { class: 'days' }, dates.map(d => el('li', {}, el('button', { type: 'button', onclick: () => { view = 'day'; viewDate = d; render(); } },
        el('span', { text: prettyDate(d) }), el('span', { 'aria-hidden': 'true', text: '›' })))))].filter(Boolean));
  }

  async function loadStations() {
    try {
      const r = await api('stations');
      stations = r.stations; store.set('buffet-stations', stations);
    } catch (err) { if (!stations.length) throw err; }
  }

  function render(keep) {
    $('#todayLabel').textContent = prettyDate(kstToday());
    if (!API) {
      $('#writeBtn').hidden = true;
      main.replaceChildren(el('div', { class: 'empty' }, el('strong', { text: '준비 중이에요' }), '곧 열어요.'));
      return;
    }
    if (!station || !stations.some(s => s.id === station)) {
      $('#writeBtn').hidden = true;
      $('#stationName').textContent = '역 고르기';
      main.replaceChildren(el('div', { class: 'empty' }, el('strong', { text: '회사 근처 역을 골라 주세요' }),
        '그 역 근처 한식뷔페의 오늘 메뉴를 보여 드려요.', el('div', { style: 'margin-top:14px' }, el('button', { class: 'btn', type: 'button', onclick: openStations }, '📍 역 고르기'))));
      return;
    }
    $('#stationName').textContent = stationName(station);
    $('#tabToday').setAttribute('aria-selected', String(view === 'today'));
    $('#tabPast').setAttribute('aria-selected', String(view !== 'today'));
    $('#writeBtn').hidden = view !== 'today';
    if (view === 'today') { viewDate = kstToday(); return renderDay(viewDate, keep); }
    if (view === 'past') return renderPast();
    return renderDay(viewDate, keep);
  }

  async function adminDo(body, question) {
    if (!confirm(question)) return;
    try { await api('admin', { password: admin, ...body }); bust = Date.now(); toast('지웠어요'); render(true); }
    catch (err) { toast(err.message); }
  }
  $('#tabToday').onclick = () => { view = 'today'; render(); };
  $('#tabPast').onclick = () => { if (!station) return openStations(); view = 'past'; render(); };

  // ── 뷔페 추가 ─────────────────────────────
  const bdlg = $('#buffetDlg'), bform = $('#buffetForm'), berr = $('#buffetErr');
  function openBuffet() {
    bform.reset(); berr.textContent = ''; $('#walkWrap').hidden = true;
    $('#buffetStation').textContent = stationName(station);
    bdlg.showModal(); bform.elements['name'].focus();
  }
  $('#cancelBuffet').onclick = () => bdlg.close();
  bform.onsubmit = async e => {
    e.preventDefault();
    berr.textContent = '';
    if (!bform.elements['name'].value.trim()) { berr.textContent = '뷔페 이름을 적어 주세요'; return bform.elements['name'].focus(); }
    if (!bform.address.value.trim()) { berr.textContent = '주소를 적어 주세요'; return bform.address.focus(); }
    const manual = !$('#walkWrap').hidden && bform.walkMin.value ? Number(bform.walkMin.value) : undefined;
    const btn = $('#submitBuffet'); btn.disabled = true; btn.textContent = manual ? '추가하는 중…' : '도보 시간 재는 중…';
    try {
      const r = await api('buffet', { station, name: bform.elements['name'].value, address: bform.address.value, walkMin: manual });
      bdlg.close(); bust = Date.now(); view = 'today';
      toast(`${r.buffet.name} 추가! ${stationName(station)}에서 걸어서 ${r.buffet.via === 'manual' ? '약 ' : ''}${r.buffet.walkMin}분`);
      render();
    } catch (err) {
      berr.textContent = err.message;
      if (err.code === 'geocode_failed' || err.code === 'geocode_far') { $('#walkWrap').hidden = false; bform.walkMin.focus(); }
    } finally { btn.disabled = false; btn.textContent = '추가'; }
  };

  // ── 글쓰기 ───────────────────────────────
  const dlg = $('#writeDlg'), form = $('#writeForm'), err = $('#writeErr');
  let photoData = null;
  function openWrite(buffetId) {
    const buffets = (lastDay && lastDay.station === station && lastDay.buffets) || [];
    if (!buffets.length) return openBuffet();
    err.textContent = ''; form.nick.value = store.get('buffet-nick', '');
    form.buffetId.replaceChildren(el('option', { value: '', text: '뷔페를 골라 주세요' }),
      ...buffets.filter(b => !b.hidden).map(b => el('option', { value: b.id, text: `${b.name} · ${walkText(b)}` })));
    form.buffetId.value = typeof buffetId === 'string' ? buffetId : (buffets.length === 1 ? buffets[0].id : '');
    dlg.showModal(); (form.buffetId.value ? form.menu : form.buffetId).focus();
  }
  $('#writeBtn').onclick = () => openWrite();
  $('#cancelWrite').onclick = () => dlg.close();

  // 긴 변 1280px JPEG 로 다시 그린다. 다시 그리면 폰 사진의 위치 정보(EXIF)도 같이 사라진다.
  async function shrink(file) {
    let src;
    try { src = await createImageBitmap(file, { imageOrientation: 'from-image' }); }
    catch { src = await new Promise((ok, no) => { const i = new Image(); i.onload = () => ok(i); i.onerror = () => no(new Error('사진을 열지 못했어요')); i.src = URL.createObjectURL(file); }); }
    const w0 = src.width, h0 = src.height;
    for (const [max, q] of [[1280, 0.82], [1024, 0.72], [800, 0.65]]) {
      const s = Math.min(1, max / Math.max(w0, h0));
      const c = document.createElement('canvas');
      c.width = Math.round(w0 * s); c.height = Math.round(h0 * s);
      c.getContext('2d').drawImage(src, 0, 0, c.width, c.height);
      const url = c.toDataURL('image/jpeg', q);
      if (url.length < 1.9 * 1024 * 1024) return url;
    }
    throw new Error('사진이 너무 커요');
  }
  form.photo.onchange = async () => {
    const f = form.photo.files[0];
    photoData = null; $('#preview').hidden = true;
    if (!f) return;
    if (!/^image\//.test(f.type)) { err.textContent = '사진 파일만 올릴 수 있어요'; form.photo.value = ''; return; }
    err.textContent = '사진 줄이는 중…';
    try { photoData = await shrink(f); $('#preview img').src = photoData; $('#preview').hidden = false; err.textContent = ''; }
    catch (e) { err.textContent = e.message; form.photo.value = ''; }
  };
  $('#rmPhoto').onclick = () => { photoData = null; form.photo.value = ''; $('#preview').hidden = true; };
  form.onsubmit = async e => {
    e.preventDefault();
    err.textContent = '';
    if (!form.buffetId.value) { err.textContent = '어느 뷔페인지 골라 주세요'; return form.buffetId.focus(); }
    if (!form.menu.value.trim()) { err.textContent = '메뉴를 한 가지 이상 적어 주세요'; return form.menu.focus(); }
    if (!form.nick.value.trim()) { err.textContent = '별명을 적어 주세요'; return form.nick.focus(); }
    const btn = $('#submitWrite'); btn.disabled = true; btn.textContent = '올리는 중…';
    try {
      await api('post', { station, buffetId: form.buffetId.value, nick: form.nick.value, menu: form.menu.value, price: form.price.value, note: form.note.value, photo: photoData || '' });
      store.set('buffet-nick', form.nick.value.trim());
      form.reset(); photoData = null; $('#preview').hidden = true;
      dlg.close(); bust = Date.now(); view = 'today'; toast('올렸어요. 고마워요!'); render();
    } catch (e2) { err.textContent = e2.message; }
    finally { btn.disabled = false; btn.textContent = '올리기'; }
  };

  // ── 관리자 ───────────────────────────────
  const adlg = $('#adminDlg'), aform = $('#adminForm');
  $('#adminLink').onclick = () => { if (!API) return; $('#adminErr').textContent = ''; aform.reset(); adlg.showModal(); };
  $('#cancelAdmin').onclick = () => adlg.close();
  aform.onsubmit = async e => {
    e.preventDefault();
    try { await api('admin', { password: aform.pw.value, action: 'check' }); admin = aform.pw.value; ss.set('buffet-admin', admin); adlg.close(); render(); }
    catch (e2) { $('#adminErr').textContent = e2.message; }
  };

  // ── 쿠팡 파트너스 광고 (온라인 + https 일 때만, 맨 아래) ──
  // 쿠팡 위젯은 document.write 로 그려서, srcdoc iframe 안에서 읽히는 순간 실행되게 한다 (bible-memory 와 같은 방식)
  function loadAd() {
    const AD = CFG.coupang || {};
    if (!AD.id || location.protocol !== 'https:' || !navigator.onLine || $('#adSlot').dataset.loaded) return;
    $('#adSlot').dataset.loaded = '1';
    const W = Math.min(360, Math.max(280, document.querySelector('.wrap').clientWidth - 32)), H = 140;
    const f = el('iframe', { title: '쿠팡 파트너스 광고', scrolling: 'no', loading: 'lazy', width: String(W), height: String(H) });
    f.srcdoc = '<!doctype html><html><head><meta charset="utf-8"><style>html,body{margin:0;padding:0;overflow:hidden}</style></head><body>'
      + '<script src="https://ads-partners.coupang.com/g.js"><\/script>'
      + '<script>new PartnersCoupang.G(' + JSON.stringify({ id: AD.id, template: 'carousel', trackingCode: AD.trackingCode, width: String(W), height: String(H), tsource: '' }) + ');<\/script>'
      + '</body></html>';
    $('#adSlot').append(f);
    $('#ad').hidden = false;
  }
  window.addEventListener('online', loadAd);

  // 앱을 켜 둔 채 날짜가 바뀌거나 다시 돌아왔을 때 새로 받는다
  document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible' && view === 'today' && station) render(true); });

  if ('serviceWorker' in navigator && location.protocol === 'https:') navigator.serviceWorker.register('sw.js').catch(() => {});
  (async () => {
    $('#todayLabel').textContent = prettyDate(kstToday());
    if (API) {
      if (!stations.length) skeleton();
      try { await loadStations(); }
      catch (e) { main.replaceChildren(el('div', { class: 'empty' }, el('strong', { text: '불러오지 못했어요' }), e.message)); return; }
    }
    if (station && stations.some(s => s.id === station)) setStation(station);
    render();
    loadAd();
  })();
})();
</script>
</body>
</html>
