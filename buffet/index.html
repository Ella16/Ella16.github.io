<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="우리동네 한식뷔페 오늘 메뉴를 동네 사람들이 사진과 글로 올리는 게시판. 오늘 반찬이 뭔지 가기 전에 확인하세요.">
<meta name="theme-color" content="#c2410c">
<link rel="canonical" href="https://ella16.github.io/buffet/">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>오늘 메뉴 게시판</title>
<script src="config.js"></script>
<style>
  :root {
    --bg: #faf6f1; --surface: #ffffff; --surface-2: #f3ece4; --text: #2a211b; --muted: #7a6a5d;
    --line: #e8ddd1; --accent: #c2410c; --accent-ink: #ffffff; --accent-soft: #fde7d9; --danger: #b91c1c;
    --shadow: 0 1px 2px rgba(60,40,20,.06), 0 4px 16px rgba(60,40,20,.06);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #1c1714; --surface: #26201c; --surface-2: #312923; --text: #f3ebe3; --muted: #b3a294;
      --line: #3d332c; --accent: #fb8a4c; --accent-ink: #1c1714; --accent-soft: #4a2c1c; --danger: #f87171;
      --shadow: 0 1px 2px rgba(0,0,0,.3);
    }
  }
  :root[data-theme="dark"] {
    --bg: #1c1714; --surface: #26201c; --surface-2: #312923; --text: #f3ebe3; --muted: #b3a294;
    --line: #3d332c; --accent: #fb8a4c; --accent-ink: #1c1714; --accent-soft: #4a2c1c; --danger: #f87171;
    --shadow: 0 1px 2px rgba(0,0,0,.3);
  }
  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 16px/1.55 system-ui, -apple-system, "Apple SD Gothic Neo", "Noto Sans KR", sans-serif; }
  button, input, textarea { font: inherit; color: inherit; }
  .wrap { max-width: 640px; margin: 0 auto; padding: 0 16px calc(96px + env(safe-area-inset-bottom)); }
  header { position: sticky; top: 0; z-index: 5; background: var(--bg); padding: calc(12px + env(safe-area-inset-top)) 0 0; }
  .title { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; }
  h1 { margin: 0; font-size: 21px; letter-spacing: -0.02em; }
  .today-label { color: var(--muted); font-size: 14px; white-space: nowrap; }
  nav { display: flex; gap: 4px; margin-top: 10px; border-bottom: 1px solid var(--line); }
  nav button { background: none; border: 0; padding: 10px 12px; font-weight: 600; color: var(--muted); border-bottom: 2px solid transparent; cursor: pointer; }
  nav button[aria-selected="true"] { color: var(--text); border-bottom-color: var(--accent); }
  main { padding-top: 14px; min-height: calc(100vh - 230px); min-height: calc(100dvh - 230px); }
  .card { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; box-shadow: var(--shadow); margin-bottom: 14px; overflow: hidden; }
  .card img.photo { display: block; width: 100%; max-height: 420px; object-fit: cover; background: var(--surface-2); }
  .card .body { padding: 14px 16px 12px; }
  .meta { display: flex; justify-content: space-between; gap: 8px; color: var(--muted); font-size: 13px; }
  .meta b { color: var(--text); font-weight: 600; }
  ul.menu { list-style: none; padding: 0; margin: 10px 0 6px; display: flex; flex-wrap: wrap; gap: 6px; }
  ul.menu li { background: var(--accent-soft); border-radius: 999px; padding: 3px 11px; font-size: 15px; overflow-wrap: anywhere; }
  .price { font-weight: 700; margin: 6px 0 0; }
  .note { margin: 6px 0 0; white-space: pre-wrap; overflow-wrap: anywhere; }
  .actions { display: flex; gap: 6px; padding: 0 10px 10px; flex-wrap: wrap; }
  .chip { display: inline-flex; align-items: center; gap: 5px; border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 6px 12px; font-size: 14px; cursor: pointer; min-height: 36px; }
  .chip[aria-pressed="true"] { background: var(--accent-soft); border-color: var(--accent); }
  .chip.quiet { border-color: transparent; color: var(--muted); margin-left: auto; }
  .chip.danger { color: var(--danger); border-color: var(--danger); }
  .comments { border-top: 1px solid var(--line); padding: 10px 16px 14px; background: var(--surface-2); }
  .comment { padding: 6px 0; border-bottom: 1px dashed var(--line); font-size: 15px; overflow-wrap: anywhere; white-space: pre-wrap; }
  .comment:last-of-type { border-bottom: 0; }
  .comment .who { font-weight: 600; margin-right: 6px; }
  .comment .when { color: var(--muted); font-size: 12px; margin-left: 6px; }
  .cform { display: grid; grid-template-columns: 90px 1fr auto; gap: 6px; margin-top: 8px; }
  input, textarea { width: 100%; border: 1px solid var(--line); background: var(--surface); border-radius: 10px; padding: 9px 11px; min-width: 0; }
  input:focus, textarea:focus { outline: 2px solid var(--accent); outline-offset: -1px; }
  .btn { border: 0; background: var(--accent); color: var(--accent-ink); font-weight: 700; border-radius: 10px; padding: 9px 16px; cursor: pointer; }
  .btn:disabled { opacity: .55; cursor: default; }
  .btn.ghost { background: var(--surface-2); color: var(--text); }
  .empty { text-align: center; color: var(--muted); padding: 48px 12px; }
  .empty strong { display: block; color: var(--text); font-size: 18px; margin-bottom: 6px; }
  .fab { position: fixed; right: max(16px, calc(50vw - 304px)); bottom: calc(20px + env(safe-area-inset-bottom)); z-index: 6; box-shadow: 0 6px 20px rgba(194,65,12,.35); border-radius: 999px; padding: 14px 22px; font-size: 16px; }
  .days { list-style: none; margin: 0; padding: 0; }
  .days button { width: 100%; text-align: left; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 13px 16px; margin-bottom: 8px; cursor: pointer; display: flex; justify-content: space-between; }
  .back { margin-bottom: 12px; }
  dialog { border: 0; border-radius: 18px; padding: 0; width: min(560px, calc(100vw - 24px)); background: var(--surface); color: var(--text); box-shadow: 0 20px 60px rgba(0,0,0,.35); }
  dialog::backdrop { background: rgba(20,12,6,.5); }
  dialog form { padding: 18px 18px 16px; display: grid; gap: 12px; }
  dialog h2 { margin: 0; font-size: 19px; }
  label { display: grid; gap: 5px; font-size: 14px; font-weight: 600; }
  label small { font-weight: 400; color: var(--muted); }
  .row { display: flex; gap: 8px; justify-content: flex-end; }
  .preview { position: relative; }
  .preview img { width: 100%; max-height: 220px; object-fit: cover; border-radius: 10px; display: block; }
  .preview button { position: absolute; top: 6px; right: 6px; }
  .err { color: var(--danger); font-size: 14px; min-height: 1em; margin: 0; }
  .toast { position: fixed; left: 50%; bottom: calc(90px + env(safe-area-inset-bottom)); transform: translateX(-50%); background: var(--text); color: var(--bg); padding: 10px 16px; border-radius: 10px; font-size: 14px; z-index: 20; max-width: calc(100vw - 32px); }
  footer { color: var(--muted); font-size: 12px; text-align: center; padding: 24px 0 0; }
  footer button { background: none; border: 0; color: inherit; text-decoration: underline; cursor: pointer; font-size: 12px; }
  .admin-bar { background: var(--danger); color: #fff; border-radius: 10px; padding: 8px 12px; font-size: 14px; display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
  .admin-bar button { background: rgba(255,255,255,.2); color: #fff; border: 0; border-radius: 8px; padding: 4px 10px; cursor: pointer; }
  .hidden-tag { background: var(--danger); color: #fff; font-size: 12px; border-radius: 6px; padding: 1px 6px; margin-left: 6px; }
  .skeleton { height: 140px; border-radius: 16px; background: var(--surface-2); margin-bottom: 14px; animation: pulse 1.2s ease-in-out infinite; }
  @keyframes pulse { 50% { opacity: .5; } }
  @media (prefers-reduced-motion: reduce) { .skeleton { animation: none; } }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="title"><h1 id="shop"></h1><span class="today-label" id="todayLabel"></span></div>
    <nav role="tablist">
      <button role="tab" id="tabToday" aria-selected="true">오늘 메뉴</button>
      <button role="tab" id="tabPast" aria-selected="false">지난 메뉴</button>
    </nav>
  </header>
  <main id="main" aria-live="polite"></main>
  <footer>
    누구나 올리는 게시판이에요. 이상한 글은 신고해 주세요 (신고 3건이면 숨겨져요).<br>
    <button id="adminLink" type="button">관리</button>
  </footer>
</div>
<button class="btn fab" id="writeBtn" type="button" hidden>＋ 오늘 메뉴 올리기</button>

<dialog id="writeDlg">
  <form id="writeForm" method="dialog" novalidate>
    <h2>오늘 메뉴 올리기</h2>
    <label>메뉴 <small>한 줄에 하나씩</small>
      <textarea name="menu" rows="6" maxlength="1200" placeholder="제육볶음&#10;잡채&#10;계란말이&#10;미역국" required></textarea></label>
    <label>사진 <small>(선택) 위치 정보는 지워서 올라가요</small>
      <input type="file" name="photo" accept="image/*"></label>
    <div class="preview" id="preview" hidden><img alt="올릴 사진 미리 보기"><button type="button" class="chip" id="rmPhoto">사진 빼기</button></div>
    <label>가격 <small>(선택)</small><input name="price" maxlength="30" placeholder="예: 9,000원"></label>
    <label>한마디 <small>(선택)</small><textarea name="note" rows="2" maxlength="300" placeholder="오늘 제육 맛있어요!"></textarea></label>
    <label>별명<input name="nick" maxlength="20" required autocomplete="nickname"></label>
    <p class="err" id="writeErr"></p>
    <div class="row"><button class="btn ghost" type="button" id="cancelWrite">취소</button><button class="btn" type="submit" id="submitWrite">올리기</button></div>
  </form>
</dialog>

<dialog id="adminDlg">
  <form id="adminForm" method="dialog">
    <h2>관리자</h2>
    <label>비밀번호<input type="password" name="pw" autocomplete="current-password" required></label>
    <p class="err" id="adminErr"></p>
    <div class="row"><button class="btn ghost" type="button" id="cancelAdmin">취소</button><button class="btn" type="submit">들어가기</button></div>
  </form>
</dialog>

<script>
(() => {
  'use strict';
  const CFG = window.BUFFET_CONFIG || {};
  const API = String(CFG.apiBase || '').replace(/\/+$/, '');
  const $ = s => document.querySelector(s);
  const main = $('#main');

  // ── 작은 도우미 ─────────────────────────────
  // 화면에 넣는 글은 모두 textContent 로만 넣는다 (스크립트가 든 글도 글자로만 보이게).
  function el(tag, attrs, ...kids) {
    const n = document.createElement(tag);
    for (const [k, v] of Object.entries(attrs || {})) {
      if (v == null || v === false) continue;
      if (k === 'class') n.className = v;
      else if (k === 'text') n.textContent = v;
      else if (k.startsWith('on')) n.addEventListener(k.slice(2), v);
      else n.setAttribute(k, v === true ? '' : v);
    }
    for (const c of kids.flat()) if (c != null) n.append(c instanceof Node ? c : document.createTextNode(String(c)));
    return n;
  }
  const store = {
    get(k, d) { try { const v = localStorage.getItem(k); return v == null ? d : JSON.parse(v); } catch { return d; } },
    set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} },
  };
  const ss = {
    get(k) { try { return sessionStorage.getItem(k); } catch { return null; } },
    set(k, v) { try { v == null ? sessionStorage.removeItem(k) : sessionStorage.setItem(k, v); } catch {} },
  };
  let cid = store.get('buffet-cid', null);
  if (!cid || !/^[A-Za-z0-9_-]{16,64}$/.test(cid)) {
    const a = new Uint8Array(18); crypto.getRandomValues(a);
    cid = btoa(String.fromCharCode(...a)).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
    store.set('buffet-cid', cid);
  }
  const liked = new Set(store.get('buffet-liked', []));
  const reported = new Set(store.get('buffet-reported', []));
  const remember = (set, key) => store.set(key, [...set].slice(-300));

  function kstToday() {
    return new Intl.DateTimeFormat('en-CA', { timeZone: 'Asia/Seoul', year: 'numeric', month: '2-digit', day: '2-digit' }).format(new Date());
  }
  const WD = ['일', '월', '화', '수', '목', '금', '토'];
  function prettyDate(d) {
    const [y, m, dd] = d.split('-').map(Number);
    const w = WD[new Date(Date.UTC(y, m - 1, dd)).getUTCDay()];
    return `${m}월 ${dd}일 (${w})`;
  }
  function prettyTime(ms) {
    return new Intl.DateTimeFormat('ko-KR', { timeZone: 'Asia/Seoul', hour: 'numeric', minute: '2-digit' }).format(new Date(ms));
  }
  let toastTimer;
  function toast(msg) {
    document.querySelectorAll('.toast').forEach(t => t.remove());
    const t = el('div', { class: 'toast', role: 'status', text: msg });
    document.body.append(t);
    clearTimeout(toastTimer); toastTimer = setTimeout(() => t.remove(), 2600);
  }

  let bust = 0; // 내가 방금 쓴 것을 바로 보려고 캐시를 건너뛸 때 쓴다
  async function api(path, body) {
    const opt = body === undefined ? { headers: {} } : { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) };
    opt.headers['X-Client-Id'] = cid;
    let res;
    try { res = await fetch(API + '/api/' + path, opt); }
    catch { throw new Error('인터넷 연결을 확인해 주세요'); }
    let data = null; try { data = await res.json(); } catch {}
    if (!res.ok) throw new Error((data && data.error) || '잠시 뒤 다시 해 주세요');
    return data;
  }
  const dayUrl = date => 'day?date=' + date + (bust ? '&t=' + bust : '');

  // ── 상태 ─────────────────────────────────
  let view = 'today';        // today | past | day
  let viewDate = kstToday();
  let admin = ss.get('buffet-admin');
  const openComments = new Set();
  let lastDay = null;

  $('#shop').textContent = CFG.name || '우리동네 한식뷔페';
  document.title = (CFG.name || '우리동네 한식뷔페') + ' · 오늘 메뉴';
  $('#todayLabel').textContent = prettyDate(kstToday());

  // ── 그리기 ───────────────────────────────
  function skeleton() { main.replaceChildren(el('div', { class: 'skeleton' }), el('div', { class: 'skeleton' })); }

  function adminBar() {
    if (!admin) return null;
    return el('div', { class: 'admin-bar' }, '관리자 모드 · 숨겨진 글도 보여요',
      el('button', { type: 'button', text: '나가기', onclick: () => { admin = null; ss.set('buffet-admin', null); render(); } }));
  }

  function postCard(p, date) {
    const isOpen = openComments.has(p.id);
    const likeBtn = el('button', { class: 'chip', type: 'button', 'aria-pressed': liked.has(p.id) ? 'true' : 'false',
      onclick: async e => {
        if (liked.has(p.id)) return;
        const b = e.currentTarget; b.disabled = true;
        try { await api('like', { date, postId: p.id }); liked.add(p.id); remember(liked, 'buffet-liked'); bust = Date.now(); p.likes++; b.setAttribute('aria-pressed', 'true'); b.lastChild.textContent = ' ' + p.likes; }
        catch (err) { toast(err.message); } finally { b.disabled = false; }
      } }, '😋 맛있어요', el('span', { text: ' ' + p.likes }));
    const cBtn = el('button', { class: 'chip', type: 'button', 'aria-expanded': String(isOpen),
      onclick: () => { isOpen ? openComments.delete(p.id) : openComments.add(p.id); render('local'); } }, '💬 댓글 ' + p.comments.length);
    const repBtn = el('button', { class: 'chip quiet', type: 'button', disabled: reported.has(p.id) || null,
      onclick: async () => {
        if (!confirm('이 글을 신고할까요? 신고가 3건 쌓이면 글이 숨겨져요.')) return;
        try { await api('report', { date, postId: p.id }); reported.add(p.id); remember(reported, 'buffet-reported'); bust = Date.now(); toast('신고했어요'); render(); }
        catch (err) { toast(err.message); }
      } }, reported.has(p.id) ? '신고함' : '신고');
    const actions = el('div', { class: 'actions' }, likeBtn, cBtn,
      admin ? el('button', { class: 'chip danger', type: 'button', onclick: () => adminDelete({ action: 'deletePost', date, postId: p.id }, '이 글을 지울까요? 되돌릴 수 없어요.') }, '글 삭제') : repBtn);

    const card = el('article', { class: 'card' },
      p.photo ? el('img', { class: 'photo', src: p.photo, alt: '메뉴 사진', loading: 'lazy', decoding: 'async' }) : null,
      el('div', { class: 'body' },
        el('div', { class: 'meta' }, el('span', {}, el('b', { text: p.nick }), p.hidden ? el('span', { class: 'hidden-tag', text: `숨김 · 신고 ${p.reports}` }) : null), el('span', { text: prettyTime(p.at) })),
        el('ul', { class: 'menu', 'aria-label': '메뉴' }, p.menu.map(m => el('li', { text: m }))),
        p.price ? el('p', { class: 'price', text: p.price }) : null,
        p.note ? el('p', { class: 'note', text: p.note }) : null),
      actions);

    if (isOpen) {
      const box = el('div', { class: 'comments' });
      if (!p.comments.length) box.append(el('div', { class: 'comment', text: '아직 댓글이 없어요.' }));
      for (const c of p.comments) {
        box.append(el('div', { class: 'comment' }, el('span', { class: 'who', text: c.nick }), c.text, el('span', { class: 'when', text: prettyTime(c.at) }),
          admin ? el('button', { class: 'chip danger', type: 'button', style: 'margin-left:8px;min-height:28px;padding:2px 8px',
            onclick: () => adminDelete({ action: 'deleteComment', date, postId: p.id, commentKey: c.key }, '이 댓글을 지울까요?') }, '삭제') : null));
      }
      const nick = el('input', { name: 'nick', maxlength: '20', placeholder: '별명', 'aria-label': '별명', value: store.get('buffet-nick', '') });
      const text = el('input', { name: 'text', maxlength: '200', placeholder: '댓글 달기', 'aria-label': '댓글' });
      const send = el('button', { class: 'btn', type: 'submit', text: '달기' });
      box.append(el('form', { class: 'cform', onsubmit: async e => {
        e.preventDefault();
        if (!nick.value.trim()) return nick.focus();
        if (!text.value.trim()) return text.focus();
        send.disabled = true;
        try {
          await api('comment', { date, postId: p.id, nick: nick.value, text: text.value });
          store.set('buffet-nick', nick.value.trim()); bust = Date.now(); render(true);
        } catch (err) { toast(err.message); send.disabled = false; }
      } }, nick, text, send));
      card.append(box);
    }
    return card;
  }

  async function renderDay(date, keep) {
    if (!keep) skeleton();
    let data;
    try {
      data = keep === 'local' && lastDay && lastDay.date === date ? lastDay : admin ? await api('admin', { password: admin, action: 'list', date }) : await api(dayUrl(date));
    } catch (err) {
      if (admin && /비밀번호/.test(err.message)) { admin = null; ss.set('buffet-admin', null); }
      main.replaceChildren(el('div', { class: 'empty' }, el('strong', { text: '메뉴를 불러오지 못했어요' }), err.message, el('div', { style: 'margin-top:14px' }, el('button', { class: 'btn', type: 'button', text: '다시 시도', onclick: () => render() }))));
      return;
    }
    lastDay = data;
    const isToday = date === kstToday();
    const kids = [adminBar()];
    if (view === 'day') kids.push(el('button', { class: 'chip back', type: 'button', onclick: () => { view = 'past'; render(); } }, '← 날짜 목록'), el('h2', { style: 'margin:0 0 12px;font-size:18px', text: prettyDate(date) + ' 메뉴' }));
    if (!data.posts.length) {
      kids.push(isToday
        ? el('div', { class: 'empty' }, el('strong', { text: '아직 오늘 메뉴가 없어요' }), '먼저 다녀오셨다면 첫 글을 올려 주세요.')
        : el('div', { class: 'empty' }, el('strong', { text: '이 날은 올라온 메뉴가 없어요' })));
    } else kids.push(...data.posts.map(p => postCard(p, date)));
    main.replaceChildren(...kids.filter(Boolean));
  }

  async function renderPast() {
    skeleton();
    let data;
    try { data = await api('days' + (bust ? '?t=' + bust : '')); }
    catch (err) { main.replaceChildren(el('div', { class: 'empty' }, el('strong', { text: '목록을 불러오지 못했어요' }), err.message)); return; }
    const today = kstToday();
    const dates = data.dates.filter(d => d !== today);
    if (!dates.length) { main.replaceChildren(adminBar() || '', el('div', { class: 'empty' }, el('strong', { text: '지난 메뉴가 아직 없어요' }), '오늘부터 쌓여요.')); return; }
    main.replaceChildren(...[adminBar(), el('ul', { class: 'days' }, dates.map(d => el('li', {}, el('button', { type: 'button', onclick: () => { view = 'day'; viewDate = d; render(); } }, el('span', { text: prettyDate(d) }), el('span', { 'aria-hidden': 'true', text: '›' }))))) ].filter(Boolean));
  }

  function render(keep) {
    if (!API) {
      $('#writeBtn').hidden = true;
      main.replaceChildren(el('div', { class: 'empty' }, el('strong', { text: '준비 중이에요' }), '곧 동네 사람들이 오늘 메뉴를 올릴 수 있게 열어요.'));
      return;
    }
    $('#tabToday').setAttribute('aria-selected', String(view === 'today'));
    $('#tabPast').setAttribute('aria-selected', String(view !== 'today'));
    $('#writeBtn').hidden = view !== 'today';
    $('#todayLabel').textContent = prettyDate(kstToday());
    if (view === 'today') { viewDate = kstToday(); return renderDay(viewDate, keep); }
    if (view === 'past') return renderPast();
    return renderDay(viewDate, keep);
  }

  async function adminDelete(body, question) {
    if (!confirm(question)) return;
    try { await api('admin', { password: admin, ...body }); bust = Date.now(); toast('지웠어요'); render(true); }
    catch (err) { toast(err.message); }
  }

  $('#tabToday').onclick = () => { view = 'today'; render(); };
  $('#tabPast').onclick = () => { view = 'past'; render(); };

  // ── 글쓰기 ───────────────────────────────
  const dlg = $('#writeDlg'), form = $('#writeForm'), err = $('#writeErr');
  let photoData = null;
  $('#writeBtn').onclick = () => { err.textContent = ''; form.nick.value = store.get('buffet-nick', ''); dlg.showModal(); form.menu.focus(); };
  $('#cancelWrite').onclick = () => dlg.close();

  // 긴 변 1280px JPEG 로 다시 그린다. 다시 그리면 폰 사진의 위치 정보(EXIF)도 같이 사라진다.
  async function shrink(file) {
    let src;
    try { src = await createImageBitmap(file, { imageOrientation: 'from-image' }); }
    catch {
      src = await new Promise((ok, no) => { const i = new Image(); i.onload = () => ok(i); i.onerror = () => no(new Error('사진을 열지 못했어요')); i.src = URL.createObjectURL(file); });
    }
    const w0 = src.width, h0 = src.height;
    for (const [max, q] of [[1280, 0.82], [1024, 0.72], [800, 0.65]]) {
      const s = Math.min(1, max / Math.max(w0, h0));
      const c = document.createElement('canvas');
      c.width = Math.round(w0 * s); c.height = Math.round(h0 * s);
      c.getContext('2d').drawImage(src, 0, 0, c.width, c.height);
      const url = c.toDataURL('image/jpeg', q);
      if (url.length < 1.9 * 1024 * 1024) return url;
    }
    throw new Error('사진이 너무 커요');
  }
  form.photo.onchange = async () => {
    const f = form.photo.files[0];
    photoData = null; $('#preview').hidden = true;
    if (!f) return;
    if (!/^image\//.test(f.type)) { err.textContent = '사진 파일만 올릴 수 있어요'; form.photo.value = ''; return; }
    err.textContent = '사진 줄이는 중…';
    try { photoData = await shrink(f); $('#preview img').src = photoData; $('#preview').hidden = false; err.textContent = ''; }
    catch (e) { err.textContent = e.message; form.photo.value = ''; }
  };
  $('#rmPhoto').onclick = () => { photoData = null; form.photo.value = ''; $('#preview').hidden = true; };

  form.onsubmit = async e => {
    e.preventDefault();
    err.textContent = '';
    if (!form.menu.value.trim()) { err.textContent = '메뉴를 한 가지 이상 적어 주세요'; return form.menu.focus(); }
    if (!form.nick.value.trim()) { err.textContent = '별명을 적어 주세요'; return form.nick.focus(); }
    const btn = $('#submitWrite'); btn.disabled = true; btn.textContent = '올리는 중…';
    try {
      await api('post', { nick: form.nick.value, menu: form.menu.value, price: form.price.value, note: form.note.value, photo: photoData || '' });
      store.set('buffet-nick', form.nick.value.trim());
      form.reset(); photoData = null; $('#preview').hidden = true;
      dlg.close(); bust = Date.now(); view = 'today'; toast('올렸어요. 고마워요!'); render();
    } catch (e2) { err.textContent = e2.message; }
    finally { btn.disabled = false; btn.textContent = '올리기'; }
  };

  // ── 관리자 ───────────────────────────────
  const adlg = $('#adminDlg'), aform = $('#adminForm');
  $('#adminLink').onclick = () => { if (!API) return; $('#adminErr').textContent = ''; aform.reset(); adlg.showModal(); };
  $('#cancelAdmin').onclick = () => adlg.close();
  aform.onsubmit = async e => {
    e.preventDefault();
    try { await api('admin', { password: aform.pw.value, action: 'check' }); admin = aform.pw.value; ss.set('buffet-admin', admin); adlg.close(); render(); }
    catch (e2) { $('#adminErr').textContent = e2.message; }
  };

  // 앱을 켜 둔 채 날짜가 바뀌거나 다시 돌아왔을 때 새로 받는다
  document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible' && view === 'today') render(true); });

  if ('serviceWorker' in navigator && location.protocol === 'https:') navigator.serviceWorker.register('sw.js').catch(() => {});
  render();
})();
</script>
</body>
</html>
