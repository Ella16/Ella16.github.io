<style>
:root{
  --paper:#E6EAE3;
  --card:#F3F5F0;
  --ink:#16201C;
  --soft:#5A655E;
  --line:#C8D0C6;
  --geum:#7E8B99;
  --to:#B8842A;
  --mok:#4E7F49;
  --su:#2C4C61;
  --radius:2px;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:var(--paper);color:var(--ink)}
body{
  font-family:'IBM Plex Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;
  font-weight:300;
  line-height:1.65;
  -webkit-font-smoothing:antialiased;
  padding:0 0 64px;
}
.serif{font-family:'Gowun Batang','Apple Myungjo','Batang',serif}
.wrap{max-width:560px;margin:0 auto;padding:0 20px}

/* ---- header ---- */
header{padding:34px 0 20px}
.eyebrow{
  font-size:11px;letter-spacing:.22em;text-transform:uppercase;
  color:var(--soft);font-weight:500;
}
h1{
  font-family:'Gowun Batang','Apple Myungjo',serif;
  font-size:34px;font-weight:700;letter-spacing:-.01em;line-height:1.25;
  margin:10px 0 8px;
}
.lede{font-size:14px;color:var(--soft);max-width:44ch}

/* ---- 오행 게이지 (signature) ---- */
.gauges{
  display:grid;grid-template-columns:repeat(4,1fr);gap:8px;
  margin:22px 0 0;
}
.gauge{text-align:center}
.tube{
  height:72px;border:1px solid var(--line);background:#fff;
  position:relative;overflow:hidden;border-radius:var(--radius);
}
.fill{
  position:absolute;left:0;right:0;bottom:0;height:0%;
  transition:height .45s cubic-bezier(.4,0,.2,1);
}
.gauge span{
  display:block;font-size:11px;margin-top:6px;color:var(--soft);
  letter-spacing:.14em;font-weight:500;
}
header.slim .eyebrow,header.slim h1,header.slim .lede{display:none}
header.slim{padding:18px 0 0}
.g-geum .fill{background:var(--geum)} .g-to .fill{background:var(--to)}
.g-mok .fill{background:var(--mok)}  .g-su .fill{background:var(--su)}

/* ---- progress ---- */
.bar{height:2px;background:var(--line);margin:26px 0 0;position:relative}
.bar i{display:block;height:100%;background:var(--ink);width:0;transition:width .35s ease}
.count{font-size:11px;letter-spacing:.16em;color:var(--soft);margin-top:10px;font-weight:500}

/* ---- question ---- */
.card{
  background:var(--card);border:1px solid var(--line);border-radius:var(--radius);
  padding:22px 20px;margin-top:14px;
  animation:rise .35s ease both;
}
@keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.topic{font-size:11px;letter-spacing:.2em;color:var(--soft);font-weight:600;margin-bottom:8px}
.qtext{
  font-family:'Gowun Batang','Apple Myungjo',serif;
  font-size:20px;font-weight:700;line-height:1.5;margin-bottom:8px;
}
.qsub{
  font-size:13px;color:var(--soft);line-height:1.6;margin-bottom:16px;
  padding-left:10px;border-left:2px solid var(--line);
}
button.opt{
  display:block;width:100%;text-align:left;cursor:pointer;
  background:#fff;border:1px solid var(--line);border-radius:var(--radius);
  padding:13px 15px;margin-bottom:8px;font:inherit;font-size:14.5px;color:var(--ink);
  line-height:1.55;
  transition:border-color .15s, background .15s, transform .1s;
}
button.opt:hover{border-color:var(--ink)}
button.opt:active{transform:scale(.99)}
button.opt:focus-visible{outline:2px solid var(--mok);outline-offset:2px}
button.skip{
  display:block;width:100%;text-align:left;cursor:pointer;
  background:transparent;border:1px dashed var(--line);border-radius:var(--radius);
  padding:12px 14px;margin-top:2px;font:inherit;font-size:13.5px;color:var(--soft);
  transition:border-color .15s,color .15s;
}
button.skip:hover{border-color:var(--soft);color:var(--ink)}
button.skip:focus-visible{outline:2px solid var(--mok);outline-offset:2px}
.navrow{display:flex;justify-content:space-between;align-items:center;margin-top:10px}
.back{
  background:none;border:none;font:inherit;font-size:12.5px;color:var(--soft);
  cursor:pointer;padding:6px 0;text-decoration:underline;
}
.skipcount{font-size:11.5px;color:var(--soft);letter-spacing:.04em}

  font-size:42px;font-weight:700;line-height:1.15;letter-spacing:-.02em;

.verdict .latin{font-size:12px;letter-spacing:.2em;color:var(--soft);margin-top:4px;font-weight:500}
.organs{display:flex;gap:10px;margin:18px 0 4px;flex-wrap:wrap}
.organ{

  padding:12px 14px;border-radius:var(--radius);

.organ b{display:block;font-size:11px;letter-spacing:.16em;color:var(--soft);font-weight:600}
.organ p{font-family:'Gowun Batang',serif;font-size:19px;font-weight:700;margin-top:3px}
.blurb{margin-top:16px;font-size:14.5px}
.chips{margin-top:16px}
.chips h4{font-size:11px;letter-spacing:.18em;color:var(--soft);font-weight:600;margin-bottom:8px}
.chip{
  display:inline-block;font-size:13px;padding:5px 10px;margin:0 6px 6px 0;
  border-radius:14px;border:1px solid var(--line);background:#fff;
}
.chip.no{border-color:#D8B4B4;background:#FBF2F2}

/* ---- 팔체질 지도 ---- */
.map{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:8px}
.cell{
  border:1px solid var(--line);background:#fff;border-radius:var(--radius);
  padding:10px 4px;text-align:center;font-size:13px;color:var(--soft);
}
.cell.on{background:var(--ink);color:#fff;border-color:var(--ink);font-weight:600}
.maplab{font-size:11px;letter-spacing:.18em;color:var(--soft);font-weight:600;margin:22px 0 8px}

.note{
  margin-top:24px;padding:16px;background:#fff;border:1px solid var(--line);
  border-radius:var(--radius);font-size:13px;color:var(--soft);line-height:1.7;
}
.note b{color:var(--ink);font-weight:600}
.again{
  margin-top:16px;width:100%;padding:14px;background:var(--ink);color:var(--paper);
  border:none;border-radius:var(--radius);font:inherit;font-size:14px;font-weight:500;cursor:pointer;
}
.again:focus-visible{outline:2px solid var(--mok);outline-offset:2px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

  "토음":{latin:"GASTROTONIA", strong:"위", weak:"방광",
    blurb:"여덟 체질 중 드물게 나타나는 쪽으로 봅니다. 위는 강한데 약물 반응이 특히 예민해, 자가 판단보다 전문가 확인이 특히 필요한 유형입니다.",
    good:["돼지고기","보리","해산물","오이"], bad:["인삼","꿀","닭고기","매운 음식","약물 남용"]},
  "목양":{latin:"HEPATONIA", strong:"간", weak:"폐 (허파)",
    blurb:"간 기운이 강하고 폐가 약한 쪽입니다. 땀을 흘려야 개운하고 육류가 힘이 되는 유형으로, 채식만 오래 하면 오히려 기운이 떨어진다고 봅니다.",
    good:["소고기","뿌리채소","콩","밀","견과류","무"], bad:["잎채소 과다","조개·게","고등어","포도","초콜릿"]},
  "목음":{latin:"CHOLECYSTONIA", strong:"담(쓸개)", weak:"심장",
    blurb:"담이 강하고 심장이 약한 쪽입니다. 육류는 대체로 맞지만 배가 차가워지면 바로 탈이 나는, 장이 예민한 유형으로 봅니다.",
    good:["소고기","무","콩","밀","호두","도라지"], bad:["찬 음식","조개류","포도","초콜릿","과음"]},
  "수양":{latin:"RENOTONIA", strong:"신장", weak:"췌장",
    blurb:"신장이 강하고 소화 기능이 약한 쪽입니다. 소식하는 편이고 찬 것에 약하며, 변비 경향이 있어도 크게 불편해하지 않는 경우가 많습니다.",
    good:["닭고기","찹쌀","감자","생강","사과","대추"], bad:["돼지고기","보리","오이","찬 음식","맥주"]},
  "수음":{latin:"VESICOTONIA", strong:"방광", weak:"위",
    blurb:"여덟 체질 중 위장이 가장 약한 쪽으로 봅니다. 과식하면 바로 탈이 나므로 조금씩 따뜻하게 먹는 것이 핵심이라고 이야기합니다.",
    good:["닭고기","찹쌀","감자","생강","시금치","대추"], bad:["돼지고기","보리","오이","찬 음식","과식"]}
};
const ORDER = ["금","토","목","수"];

let idx = 0, answers = [];

function scores(){
  const s = {금:0,토:0,목:0,수:0}; let y = 0;
  answers.forEach(a => {
    for (const k in a.s) s[k] += a.s[k];
    y += a.y;
  });
  return {s, y};
}

function render(){
  // 첫 문항 이후에는 제목·소개문을 접어 문항이 화면 맨 위에 오게 한다.
  document.querySelector("header").classList.toggle("slim", idx > 0);
  finish();
}

function finish(){
  document.getElementById("prog").style.width = (idx / Q.length * 100) + "%";
  document.getElementById("count").textContent =
    idx < Q.length ? `문항 ${idx+1} / ${Q.length}` : `${Q.length}개 문항 완료`;
  const stage = document.getElementById("stage");
  if (idx < Q.length) { stage.innerHTML = qHTML(Q[idx]); bindQ(); }
  else { stage.innerHTML = resultHTML(); document.getElementById("again").onclick = reset; }
}

function qHTML(q){
  return `<section class="card">
    <div class="topic">${q.topic}</div>
    <h2 class="qtext">${q.q}</h2>
    ${q.sub ? `<p class="qsub">${q.sub}</p>` : ""}
    ${q.o.map((o,i)=>`<button class="opt" data-i="${i}">${o.t}</button>`).join("")}
    <button class="skip" id="skip">잘 모르겠다 · 해당 없음</button>
    <div class="navrow">
      ${idx>0 ? `<button class="back" id="back">이전 문항으로</button>` : `<span></span>`}
      ${skipCount()>0 ? `<span class="skipcount">건너뛴 문항 ${skipCount()}개</span>` : `<span></span>`}
    </div>
  </section>`;
}

const SKIP = {t:"잘 모르겠다", s:{}, y:0, skip:true};
function skipCount(){ return answers.filter(a => a && a.skip).length; }

function choose(ans){
  answers[idx] = ans; idx++; render();
  window.scrollTo({top:0,behavior:'smooth'});
}

function bindQ(){
  document.querySelectorAll("button.opt").forEach(b => {
    b.onclick = () => choose(Q[idx].o[+b.dataset.i]);
  });
  document.getElementById("skip").onclick = () => choose(SKIP);
  const back = document.getElementById("back");
  if (back) back.onclick = () => { idx--; answers.length = idx; render(); };
}

function resultHTML(){
  const {s, y} = scores();
  const skipped = skipCount(), answered = Q.length - skipped;

  if (answered < 10) {
    return `<section class="card verdict">
      <div class="topic">결과 없음</div>
      <div class="name" style="font-size:30px">답한 문항이<br>너무 적습니다</div>
      <p class="blurb">${Q.length}개 중 ${answered}개만 답하셨습니다. 이 정도로는 어느 쪽으로 기우는지 판단할 근거가 부족합니다.</p>
      <div class="note">
        답하기 어려운 문항이 많았다면, 2~3주 정도 식사와 그날의 컨디션(소화·수면·피부·기운)을 기록해 보세요. 육류·유제품·밀가루·찬 음식에 몸이 어떻게 반응하는지가 드러나면 그때 다시 해보시는 편이 훨씬 정확합니다.
      </div>
      <button class="again" id="again">처음부터 다시 하기</button>
    </section>`;
  }

  const ranked = ORDER.slice().sort((a,b) => s[b]-s[a]);
  const group = ranked[0];
  const pole = y >= 0 ? "양" : "음";
  const key = group + pole;
  const t = TYPES[key];
  const second = ranked[1];
  const gap = s[group] - s[second];
  const total = ORDER.reduce((n,k)=>n+s[k],0) || 1;

  const cells = ["양","음"].map(p =>
    ORDER.map(g => `<div class="cell${g+p===key?" on":""}">${g}${p}</div>`).join("")
  ).join("");

  const GCLS = {금:"g-geum", 토:"g-to", 목:"g-mok", 수:"g-su"};
  const GHAN = {금:"금 金", 토:"토 土", 목:"목 木", 수:"수 水"};
  const gmax = Math.max(1, ...ORDER.map(k => s[k]));
  const gaugeCells = ORDER.map(k =>
    `<div class="gauge ${GCLS[k]}"><div class="tube"><div class="fill" style="height:${Math.round(s[k]/gmax*100)}%"></div></div><span>${GHAN[k]}</span></div>`
  ).join("");

  return `<section class="card verdict">
    <div class="topic">가장 가까운 유형</div>
    <div class="name">${key}체질</div>
    <div class="latin">${t.latin}</div>

    <div class="organs">
      <div class="organ"><b>강한 쪽</b><p>${t.strong}</p></div>
      <div class="organ"><b>약한 쪽</b><p>${t.weak}</p></div>
    </div>

    <p class="blurb">${t.blurb}</p>

    <div class="chips">
      <h4>잘 맞는다고 보는 것</h4>
      ${t.good.map(x=>`<span class="chip">${x}</span>`).join("")}
    </div>
    <div class="chips">
      <h4>조심하라고 보는 것</h4>
      ${t.bad.map(x=>`<span class="chip no">${x}</span>`).join("")}
    </div>

    <div class="maplab">팔체질 지도</div>
    <div class="map">${cells}</div>

    <div class="maplab">네 갈래 게이지</div>
    <div class="gauges">${gaugeCells}</div>

    <div class="note">
      <b>점수 분포</b> · 금 ${Math.round(s.금/total*100)}% · 토 ${Math.round(s.토/total*100)}% · 목 ${Math.round(s.목/total*100)}% · 수 ${Math.round(s.수/total*100)}%<br>
      <b>답한 문항</b> ${answered}개 / 건너뛴 문항 ${skipped}개<br>
      ${skipped >= 9 ? `건너뛴 문항이 ${skipped}개라 결과가 흔들릴 수 있습니다. 몸의 반응을 좀 더 관찰한 뒤 다시 해보세요.<br>` : ``}
      ${gap <= 2
        ? `1위 ${group}과 2위 ${second}의 점수 차가 ${gap}점뿐입니다. <b>${second+pole}체질일 가능성도 비슷하게 열려 있습니다.</b>`
        : `2위는 ${second} 계열이며 ${gap}점 차이입니다.`}
      <br><br>
      <b>이 결과를 어떻게 받아들일까</b><br>
      8체질의 공식 진단법은 양쪽 손목을 짚는 맥진이고, 설문은 그것과 일치율이 높지 않습니다. 확정된 체질이 아니라 "내 몸이 어느 쪽으로 기우는지"를 보는 출발점으로 써 주세요. 확인하려면 팔체질을 다루는 한의원의 진맥이 필요합니다.<br><br>
      권장 음식·기피 음식은 8체질론에서 통용되는 내용을 옮긴 것으로, 현대 의학에서 검증된 식이 지침은 아닙니다. 특정 식품군을 오래 제한하면 영양이 치우칠 수 있으니 지병이 있거나 약을 드시는 중이라면 주치의와 상의하세요.
    </div>

    <button class="again" id="again">처음부터 다시 하기</button>
  </section>`;
}

function reset(){ idx = 0; answers = []; render(); window.scrollTo({top:0,behavior:'smooth'}); }
render();
</script>
</body>
</html>
