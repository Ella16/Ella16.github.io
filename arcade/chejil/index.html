<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>8체질 자가테스트</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=IBM+Plex+Sans+KR:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#E6EAE3;
  --card:#F3F5F0;
  --ink:#16201C;
  --soft:#5A655E;
  --line:#C8D0C6;
  --geum:#7E8B99;
  --to:#B8842A;
  --mok:#4E7F49;
  --su:#2C4C61;
  --radius:2px;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:var(--paper);color:var(--ink)}
body{
  font-family:'IBM Plex Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;
  font-weight:300;
  line-height:1.65;
  -webkit-font-smoothing:antialiased;
  padding:0 0 64px;
}
.serif{font-family:'Gowun Batang','Apple Myungjo','Batang',serif}
.wrap{max-width:560px;margin:0 auto;padding:0 20px}

/* ---- header ---- */
header{padding:34px 0 20px}
.eyebrow{
  font-size:11px;letter-spacing:.22em;text-transform:uppercase;
  color:var(--soft);font-weight:500;
}
h1{
  font-family:'Gowun Batang','Apple Myungjo',serif;
  font-size:34px;font-weight:700;letter-spacing:-.01em;line-height:1.25;
  margin:10px 0 8px;
}
.lede{font-size:14px;color:var(--soft);max-width:44ch}

/* ---- 오행 게이지 (signature) ---- */
.gauges{
  display:grid;grid-template-columns:repeat(4,1fr);gap:8px;
  margin:22px 0 0;
}
.gauge{text-align:center}
.tube{
  height:72px;border:1px solid var(--line);background:#fff;
  position:relative;overflow:hidden;border-radius:var(--radius);
}
.fill{
  position:absolute;left:0;right:0;bottom:0;height:0%;
  transition:height .45s cubic-bezier(.4,0,.2,1);
}
.gauge span{
  display:block;font-size:11px;margin-top:6px;color:var(--soft);
  letter-spacing:.14em;font-weight:500;
}
.g-geum .fill{background:var(--geum)} .g-to .fill{background:var(--to)}
.g-mok .fill{background:var(--mok)}  .g-su .fill{background:var(--su)}

/* ---- progress ---- */
.bar{height:2px;background:var(--line);margin:26px 0 0;position:relative}
.bar i{display:block;height:100%;background:var(--ink);width:0;transition:width .35s ease}
.count{font-size:11px;letter-spacing:.16em;color:var(--soft);margin-top:10px;font-weight:500}

/* ---- question ---- */
.card{
  background:var(--card);border:1px solid var(--line);border-radius:var(--radius);
  padding:22px 20px;margin-top:14px;
  animation:rise .35s ease both;
}
@keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.topic{font-size:11px;letter-spacing:.2em;color:var(--soft);font-weight:600;margin-bottom:8px}
.qtext{
  font-family:'Gowun Batang','Apple Myungjo',serif;
  font-size:20px;font-weight:700;line-height:1.5;margin-bottom:16px;
}
button.opt{
  display:block;width:100%;text-align:left;cursor:pointer;
  background:#fff;border:1px solid var(--line);border-radius:var(--radius);
  padding:13px 14px;margin-bottom:8px;font:inherit;font-size:14.5px;color:var(--ink);
  transition:border-color .15s, background .15s, transform .1s;
}
button.opt:hover{border-color:var(--ink)}
button.opt:active{transform:scale(.99)}
button.opt:focus-visible{outline:2px solid var(--mok);outline-offset:2px}
.back{
  background:none;border:none;font:inherit;font-size:12.5px;color:var(--soft);
  cursor:pointer;margin-top:6px;padding:6px 0;text-decoration:underline;
}

/* ---- result ---- */
.verdict{margin-top:18px}
.verdict .name{
  font-family:'Gowun Batang','Apple Myungjo',serif;
  font-size:42px;font-weight:700;line-height:1.15;letter-spacing:-.02em;
}
.verdict .latin{font-size:12px;letter-spacing:.2em;color:var(--soft);margin-top:4px;font-weight:500}
.organs{display:flex;gap:10px;margin:18px 0 4px;flex-wrap:wrap}
.organ{
  flex:1;min-width:130px;background:#fff;border:1px solid var(--line);
  padding:12px 14px;border-radius:var(--radius);
}
.organ b{display:block;font-size:11px;letter-spacing:.16em;color:var(--soft);font-weight:600}
.organ p{font-family:'Gowun Batang',serif;font-size:19px;font-weight:700;margin-top:3px}
.blurb{margin-top:16px;font-size:14.5px}
.chips{margin-top:16px}
.chips h4{font-size:11px;letter-spacing:.18em;color:var(--soft);font-weight:600;margin-bottom:8px}
.chip{
  display:inline-block;font-size:13px;padding:5px 10px;margin:0 6px 6px 0;
  border-radius:14px;border:1px solid var(--line);background:#fff;
}
.chip.no{border-color:#D8B4B4;background:#FBF2F2}

/* ---- 팔체질 지도 ---- */
.map{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:8px}
.cell{
  border:1px solid var(--line);background:#fff;border-radius:var(--radius);
  padding:10px 4px;text-align:center;font-size:13px;color:var(--soft);
}
.cell.on{background:var(--ink);color:#fff;border-color:var(--ink);font-weight:600}
.maplab{font-size:11px;letter-spacing:.18em;color:var(--soft);font-weight:600;margin:22px 0 8px}

.note{
  margin-top:24px;padding:16px;background:#fff;border:1px solid var(--line);
  border-radius:var(--radius);font-size:13px;color:var(--soft);line-height:1.7;
}
.note b{color:var(--ink);font-weight:600}
.again{
  margin-top:16px;width:100%;padding:14px;background:var(--ink);color:var(--paper);
  border:none;border-radius:var(--radius);font:inherit;font-size:14px;font-weight:500;cursor:pointer;
}
.again:focus-visible{outline:2px solid var(--mok);outline-offset:2px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="eyebrow">권도원 8체질론 기반</div>
    <h1>내 몸은<br>어느 쪽으로 기울까</h1>
    <p class="lede">16개 문항에 답하면 금·토·목·수 네 갈래 중 어느 쪽 성향이 강한지 보여줍니다. 진단이 아니라 참고용 지표입니다.</p>
    <div class="gauges" id="gauges">
      <div class="gauge g-geum"><div class="tube"><div class="fill" id="f-금"></div></div><span>금 金</span></div>
      <div class="gauge g-to"><div class="tube"><div class="fill" id="f-토"></div></div><span>토 土</span></div>
      <div class="gauge g-mok"><div class="tube"><div class="fill" id="f-목"></div></div><span>목 木</span></div>
      <div class="gauge g-su"><div class="tube"><div class="fill" id="f-수"></div></div><span>수 水</span></div>
    </div>
    <div class="bar"><i id="prog"></i></div>
    <div class="count" id="count"></div>
  </header>
  <main id="stage"></main>
</div>

<script>
const Q = [
  { topic:"땀", q:"땀을 흘리고 난 뒤 몸이 어떤가요?",
    o:[
      {t:"가볍고 개운하다. 땀 빼는 운동이 잘 맞는다", s:{목:3}, y:1},
      {t:"기운이 쭉 빠지고 한참 피곤하다", s:{금:3, 수:1}, y:-1},
      {t:"평소 땀이 거의 나지 않는다", s:{수:3}, y:1},
      {t:"땀은 많이 나지만 컨디션과 별 상관없다", s:{토:2, 목:1}, y:0}
    ]},
  { topic:"체온", q:"사우나나 뜨거운 탕은 어떤가요?",
    o:[
      {t:"오래 있어도 좋고 나오면 몸이 풀린다", s:{목:3, 수:1}, y:1},
      {t:"금방 답답하고 어지럽다. 찬물이 시원하다", s:{금:3, 토:1}, y:-1},
      {t:"미지근한 물이 제일 편하다", s:{수:1, 금:1}, y:0}
    ]},
  { topic:"육류", q:"고기를 먹은 다음 날 몸 상태는?",
    o:[
      {t:"힘이 나고 든든하다. 안 먹으면 기운이 없다", s:{목:4}, y:1},
      {t:"더부룩하거나 피부에 뭐가 올라온다", s:{금:4}, y:-1},
      {t:"돼지고기는 괜찮은데 닭·양고기는 열이 오른다", s:{토:3, 금:1}, y:1},
      {t:"닭고기처럼 따뜻한 고기가 오히려 편하다", s:{수:3, 목:1}, y:1}
    ]},
  { topic:"소화", q:"평소 위장은 어떤가요?",
    o:[
      {t:"뭘 먹어도 잘 소화되고 금방 배가 고프다", s:{토:4}, y:1},
      {t:"조금만 먹어도 더부룩하고 자주 체한다", s:{수:4}, y:-1},
      {t:"찬 음식이나 밀가루를 먹으면 바로 화장실에 간다", s:{금:2, 목:1}, y:-1},
      {t:"특별히 문제를 느낀 적이 없다", s:{}, y:0}
    ]},
  { topic:"기질", q:"본인 성격에 더 가까운 쪽은?",
    o:[
      {t:"급하고 추진력 있다. 욱하는 편", s:{토:3, 금:1}, y:1},
      {t:"느긋하고 참을성이 있다. 무던한 편", s:{목:3}, y:1},
      {t:"꼼꼼하고 예민하다. 생각이 많다", s:{수:3, 금:1}, y:-1}
    ]},
  { topic:"체형", q:"살이 붙는 방식은?",
    o:[
      {t:"상체·어깨가 발달했고 살은 잘 안 찐다", s:{금:3}, y:1},
      {t:"배와 허리 위주로 잘 찐다", s:{목:3, 토:1}, y:1},
      {t:"전체적으로 마르고 아무리 먹어도 안 찐다", s:{수:3, 금:1}, y:-1},
      {t:"단단하고 근육이 잘 붙는다", s:{토:2, 목:2}, y:1}
    ]},
  { topic:"보약", q:"인삼이나 홍삼을 먹으면?",
    o:[
      {t:"열이 오르고 잠이 안 온다", s:{금:3, 토:2}, y:1},
      {t:"확실히 기운이 난다", s:{수:3, 목:1}, y:1},
      {t:"먹어본 적이 없거나 잘 모르겠다", s:{}, y:0}
    ]},
  { topic:"약물", q:"항생제·진통제 같은 약에 대한 반응은?",
    o:[
      {t:"부작용이 잦다. 약을 잘 못 견딘다", s:{금:4}, y:0},
      {t:"별 탈 없이 잘 듣는다", s:{목:2, 토:1}, y:0},
      {t:"약을 거의 먹지 않아 모르겠다", s:{}, y:0}
    ]},
  { topic:"유제품", q:"우유나 치즈를 먹으면?",
    o:[
      {t:"속이 부글거리거나 설사를 한다", s:{금:3, 수:1}, y:-1},
      {t:"아무렇지 않고 오히려 잘 맞는다", s:{목:3, 토:1}, y:1},
      {t:"잘 모르겠다", s:{}, y:0}
    ]},
  { topic:"기호품", q:"커피 한 잔의 여파는?",
    o:[
      {t:"심장이 뛰고 밤에 잠을 못 잔다", s:{금:3, 수:1}, y:-1},
      {t:"저녁에 마셔도 잘 잔다", s:{목:2, 토:2}, y:1},
      {t:"속이 쓰리다", s:{토:1, 수:2}, y:-1}
    ]},
  { topic:"곡물", q:"밀가루 음식(빵·면)을 먹으면?",
    o:[
      {t:"더부룩하고 몸이 붓는다", s:{금:3, 수:1}, y:-1},
      {t:"잘 맞고 즐겨 먹는다", s:{목:2, 토:2}, y:1},
      {t:"별 차이를 못 느낀다", s:{}, y:0}
    ]},
  { topic:"해산물", q:"생선회나 조개류는?",
    o:[
      {t:"잘 맞고 먹으면 컨디션이 좋다", s:{금:4}, y:1},
      {t:"조개·갑각류를 먹고 탈이 난 적 있다", s:{목:3, 수:1}, y:-1},
      {t:"별 차이가 없다", s:{}, y:0}
    ]},
  { topic:"한열", q:"더위와 추위 중 어느 쪽이 힘든가요?",
    o:[
      {t:"더위를 많이 탄다", s:{토:3, 목:1}, y:1},
      {t:"추위를 많이 타고 손발이 차다", s:{수:3}, y:-1},
      {t:"둘 다 예민하다", s:{금:2, 수:1}, y:-1}
    ]},
  { topic:"피부·호흡", q:"이 중 겪어본 것에 가까운 쪽은?",
    o:[
      {t:"아토피·두드러기·금속 알레르기", s:{금:4}, y:1},
      {t:"비염·기관지염 등 호흡기가 약함", s:{목:3}, y:1},
      {t:"딱히 없다", s:{}, y:0}
    ]},
  { topic:"장", q:"배와 화장실 습관은?",
    o:[
      {t:"배가 차거나 긴장하면 바로 신호가 온다", s:{금:2, 목:2}, y:-1},
      {t:"변비 경향이 있다", s:{수:2, 토:1}, y:1},
      {t:"규칙적이고 편한 편", s:{}, y:0}
    ]},
  { topic:"운동·술", q:"격한 운동이나 과음 다음 날은?",
    o:[
      {t:"개운하다. 회복이 빠르다", s:{목:3, 토:1}, y:1},
      {t:"며칠씩 피곤이 남는다", s:{금:3, 수:1}, y:-1},
      {t:"조금만 마셔도 얼굴이 빨개지고 힘들다", s:{금:2, 수:2}, y:-1}
    ]}
];

const TYPES = {
  "금양":{latin:"PULMOTONIA", strong:"폐 (허파)", weak:"간", 
    blurb:"폐 기운이 강하고 간이 약한 쪽입니다. 몸이 예민해서 음식과 약에 반응이 빨리 오는 편이고, 그만큼 안 맞는 걸 빼는 것만으로 컨디션이 크게 달라진다고 봅니다.",
    good:["잎채소","생선·조개","쌀","메밀","포도","키위"], bad:["소·닭고기","우유·치즈","밀가루","인삼·홍삼","커피"]},
  "금음":{latin:"COLONOTONIA", strong:"대장", weak:"담(쓸개)",
    blurb:"대장이 강하고 담이 약한 쪽입니다. 여덟 체질 중 육류에 가장 민감하다고 보며, 장이 예민해 긴장하면 바로 배로 신호가 오는 경우가 많습니다.",
    good:["잎채소","생선","쌀","메밀","조개류"], bad:["모든 육류","우유","밀가루","인삼","항생제 남용"]},
  "토양":{latin:"PANCREOTONIA", strong:"췌장·위", weak:"신장",
    blurb:"소화 기능이 강하고 신장이 약한 쪽입니다. 위장이 튼튼해 뭘 먹어도 잘 견디지만, 그래서 오히려 열이 쌓이고 급한 성정이 문제가 된다고 봅니다.",
    good:["돼지고기","보리","오이","해산물","팥","참외"], bad:["인삼·홍삼","꿀","닭고기","매운 음식","생강"]},
  "토음":{latin:"GASTROTONIA", strong:"위", weak:"방광",
    blurb:"여덟 체질 중 드물게 나타나는 쪽으로 봅니다. 위는 강한데 약물 반응이 특히 예민해, 자가 판단보다 전문가 확인이 특히 필요한 유형입니다.",
    good:["돼지고기","보리","해산물","오이"], bad:["인삼","꿀","닭고기","매운 음식","약물 남용"]},
  "목양":{latin:"HEPATONIA", strong:"간", weak:"폐 (허파)",
    blurb:"간 기운이 강하고 폐가 약한 쪽입니다. 땀을 흘려야 개운하고 육류가 힘이 되는 유형으로, 채식만 오래 하면 오히려 기운이 떨어진다고 봅니다.",
    good:["소고기","뿌리채소","콩","밀","견과류","무"], bad:["잎채소 과다","조개·게","고등어","포도","초콜릿"]},
  "목음":{latin:"CHOLECYSTONIA", strong:"담(쓸개)", weak:"심장",
    blurb:"담이 강하고 심장이 약한 쪽입니다. 육류는 대체로 맞지만 배가 차가워지면 바로 탈이 나는, 장이 예민한 유형으로 봅니다.",
    good:["소고기","무","콩","밀","호두","도라지"], bad:["찬 음식","조개류","포도","초콜릿","과음"]},
  "수양":{latin:"RENOTONIA", strong:"신장", weak:"췌장",
    blurb:"신장이 강하고 소화 기능이 약한 쪽입니다. 소식하는 편이고 찬 것에 약하며, 변비 경향이 있어도 크게 불편해하지 않는 경우가 많습니다.",
    good:["닭고기","찹쌀","감자","생강","사과","대추"], bad:["돼지고기","보리","오이","찬 음식","맥주"]},
  "수음":{latin:"VESICOTONIA", strong:"방광", weak:"위",
    blurb:"여덟 체질 중 위장이 가장 약한 쪽으로 봅니다. 과식하면 바로 탈이 나므로 조금씩 따뜻하게 먹는 것이 핵심이라고 이야기합니다.",
    good:["닭고기","찹쌀","감자","생강","시금치","대추"], bad:["돼지고기","보리","오이","찬 음식","과식"]}
};
const ORDER = ["금","토","목","수"];

let idx = 0, answers = [];

function scores(){
  const s = {금:0,토:0,목:0,수:0}; let y = 0;
  answers.forEach(a => {
    for (const k in a.s) s[k] += a.s[k];
    y += a.y;
  });
  return {s, y};
}

function render(){
  const {s} = scores();
  const max = Math.max(1, ...ORDER.map(k => s[k]));
  ORDER.forEach(k => {
    document.getElementById("f-"+k).style.height =
      (answers.length ? Math.round(s[k]/max*100) : 0) + "%";
  });
  document.getElementById("prog").style.width = (idx / Q.length * 100) + "%";
  document.getElementById("count").textContent =
    idx < Q.length ? `문항 ${idx+1} / ${Q.length}` : `${Q.length}개 문항 완료`;

  const stage = document.getElementById("stage");
  if (idx < Q.length) { stage.innerHTML = qHTML(Q[idx]); bindQ(); }
  else { stage.innerHTML = resultHTML(); document.getElementById("again").onclick = reset; }
}

function qHTML(q){
  return `<section class="card">
    <div class="topic">${q.topic}</div>
    <h2 class="qtext">${q.q}</h2>
    ${q.o.map((o,i)=>`<button class="opt" data-i="${i}">${o.t}</button>`).join("")}
    ${idx>0 ? `<button class="back" id="back">이전 문항으로</button>` : ""}
  </section>`;
}

function bindQ(){
  document.querySelectorAll("button.opt").forEach(b => {
    b.onclick = () => { answers[idx] = Q[idx].o[+b.dataset.i]; idx++; render(); window.scrollTo({top:0,behavior:'smooth'}); };
  });
  const back = document.getElementById("back");
  if (back) back.onclick = () => { idx--; answers.length = idx; render(); };
}

function resultHTML(){
  const {s, y} = scores();
  const ranked = ORDER.slice().sort((a,b) => s[b]-s[a]);
  const group = ranked[0];
  const pole = y >= 0 ? "양" : "음";
  const key = group + pole;
  const t = TYPES[key];
  const second = ranked[1];
  const gap = s[group] - s[second];
  const total = ORDER.reduce((n,k)=>n+s[k],0) || 1;

  const cells = ["양","음"].map(p =>
    ORDER.map(g => `<div class="cell${g+p===key?" on":""}">${g}${p}</div>`).join("")
  ).join("");

  return `<section class="card verdict">
    <div class="topic">가장 가까운 유형</div>
    <div class="name">${key}체질</div>
    <div class="latin">${t.latin}</div>

    <div class="organs">
      <div class="organ"><b>강한 쪽</b><p>${t.strong}</p></div>
      <div class="organ"><b>약한 쪽</b><p>${t.weak}</p></div>
    </div>

    <p class="blurb">${t.blurb}</p>

    <div class="chips">
      <h4>잘 맞는다고 보는 것</h4>
      ${t.good.map(x=>`<span class="chip">${x}</span>`).join("")}
    </div>
    <div class="chips">
      <h4>조심하라고 보는 것</h4>
      ${t.bad.map(x=>`<span class="chip no">${x}</span>`).join("")}
    </div>

    <div class="maplab">팔체질 지도</div>
    <div class="map">${cells}</div>

    <div class="note">
      <b>점수 분포</b> · 금 ${Math.round(s.금/total*100)}% · 토 ${Math.round(s.토/total*100)}% · 목 ${Math.round(s.목/total*100)}% · 수 ${Math.round(s.수/total*100)}%<br>
      ${gap <= 2
        ? `1위 ${group}과 2위 ${second}의 점수 차가 ${gap}점뿐입니다. <b>${second+pole}체질일 가능성도 비슷하게 열려 있습니다.</b>`
        : `2위는 ${second} 계열이며 ${gap}점 차이입니다.`}
      <br><br>
      <b>이 결과를 어떻게 받아들일까</b><br>
      8체질의 공식 진단법은 양쪽 손목을 짚는 맥진이고, 설문은 그것과 일치율이 높지 않습니다. 확정된 체질이 아니라 "내 몸이 어느 쪽으로 기우는지"를 보는 출발점으로 써 주세요. 확인하려면 팔체질을 다루는 한의원의 진맥이 필요합니다.<br><br>
      권장 음식·기피 음식은 8체질론에서 통용되는 내용을 옮긴 것으로, 현대 의학에서 검증된 식이 지침은 아닙니다. 특정 식품군을 오래 제한하면 영양이 치우칠 수 있으니 지병이 있거나 약을 드시는 중이라면 주치의와 상의하세요.
    </div>

    <button class="again" id="again">처음부터 다시 하기</button>
  </section>`;
}

function reset(){ idx = 0; answers = []; render(); window.scrollTo({top:0,behavior:'smooth'}); }
render();
</script>
</body>
</html>
