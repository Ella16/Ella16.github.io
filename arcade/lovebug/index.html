<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LOVEBUG - 러브버그의 사랑</title>
<style>
  html, body { margin:0; padding:0; height:100%; background:#0b0f0b;
    display:flex; align-items:center; justify-content:center;
    font-family:'Courier New', monospace; overflow:hidden; user-select:none; }
  #wrap { display:flex; flex-direction:column; align-items:center; gap:8px; }
  #screen { image-rendering:pixelated; image-rendering:crisp-edges;
    border:4px solid #1e2b1e; box-shadow:0 0 0 4px #0b0f0b, 0 0 24px rgba(120,220,120,0.15);
    background:#000; touch-action:none; cursor:pointer; }  /* 크기는 JS가 정수배로 설정(선명) */
  #hint { color:#4a6b4a; font-size:11px; letter-spacing:1px; text-align:center; line-height:1.6; }
  #hint b { color:#8fce8f; }
  .keycap { display:inline-block; border:1px solid #3a5a3a; border-radius:3px; padding:1px 6px; color:#9fe09f; margin:0 1px; }
  #pad { display:flex; align-items:center; justify-content:center; gap:28px; touch-action:none; }
  .dpad { display:grid; grid-template-columns:repeat(3,34px); grid-template-rows:repeat(2,34px); gap:3px; }
  #pad button { font-family:inherit; font-size:15px; color:#9fe09f; background:#16211a;
    border:1px solid #3a5a3a; border-radius:6px; touch-action:none; -webkit-user-select:none; user-select:none; }
  #pad button:active { background:#2a4030; }
  .dpad .up{grid-column:2;grid-row:1;} .dpad .left{grid-column:1;grid-row:2;}
  .dpad .down{grid-column:2;grid-row:2;} .dpad .right{grid-column:3;grid-row:2;}
  #act { width:46px; height:46px; border-radius:50%; font-size:18px; }
</style>
</head>
<body>
<div id="wrap">
  <canvas id="screen" width="160" height="256"></canvas>
  <div id="pad">
    <div class="dpad">
      <button class="up" data-k="ArrowUp">▲</button>
      <button class="left" data-k="ArrowLeft">◀</button>
      <button class="down" data-k="ArrowDown">▼</button>
      <button class="right" data-k="ArrowRight">▶</button>
    </div>
    <button id="act" data-k=" ">●</button>
  </div>
  <div id="hint">📱 <b>탭</b> 시작 · <b>끌어서</b> 이동 · 연타 탈출　|　🖥 방향키·<span class="keycap">SPACE</span>·<span class="keycap">C</span></div>
</div>
<script>
(() => {
  "use strict";
  const cv = document.getElementById('screen');
  const ctx = cv.getContext('2d');
  ctx.imageSmoothingEnabled = false;
  const W = 160, H = 256;

  // 화면에 맞는 최대 '정수배'로 캔버스를 키움 → 픽셀이 딱 떨어지는 선명한 사각형(가능한 크게)
  function fitCanvas(){
    const sW = Math.floor((window.innerWidth  - 6) / W);      // 가로폭 기준(폰에선 보통 2배가 최대)
    const sH = Math.floor((window.innerHeight - 72) / H);     // 아래 컨트롤 여유(컴팩트)
    const s  = Math.max(1, Math.min(sW, sH));
    cv.style.width = (W*s)+'px'; cv.style.height = (H*s)+'px';
  }
  window.addEventListener('resize', fitCanvas); fitCanvas();

  // ===== 팔레트: 딱 2색 =====
  const PALETTES = [
    ['#9bbc0f', '#0f380f'], // 녹흑
    ['#f4f4f4', '#101010'], // 흑백
  ];
  let palIdx = 0;
  const C = () => PALETTES[palIdx];   // C()[0]=배경, C()[1]=전경

  // ===== 입력 =====
  const keys = {};
  let mash = 0;   // 거미줄 탈출용 연타 카운터
  addEventListener('keydown', e => {
    if (['ArrowUp','ArrowDown','ArrowLeft','ArrowRight',' '].includes(e.key)) { e.preventDefault(); mash++; }
    keys[e.key] = true;
    if (e.key === 'c' || e.key === 'C') palIdx = (palIdx+1) % PALETTES.length;
    if (e.key === ' ') pressAction();
    // ── 개발자 히든 단축키 ──
    if (e.key>='1' && e.key<='9') { const n=+e.key; if (STAGES[n]) startStage(n); }  // 해당 스테이지 즉시 이동
    if (e.key==='0') { if (screen==='play') stageClear(); }                          // 현재 판 즉시 클리어
    if (e.key==='-') { if (screen==='play') stageFail('개발자 강제 종료'); }          // 현재 판 즉시 실패
  });
  addEventListener('keyup', e => { keys[e.key] = false; });

  // SPACE/● 액션 (메뉴 진행 + 거미줄 탈출 연타는 mash로 처리)
  function pressAction() {
    if (screen==='title') startNewGame();
    else if (screen==='cleared') { const n=stage+1; if (STAGES[n]) startStage(n); else screen='ending'; }
    else if (screen==='gameover') startStage(stage);
    else if (screen==='ending') screen='title';
  }

  // 모바일 터치 조작: 화면 버튼 → keys 상태에 매핑
  document.querySelectorAll('#pad button').forEach(btn => {
    const k = btn.getAttribute('data-k');
    const press = e => { e.preventDefault(); mash++; if (k===' ') pressAction(); else keys[k]=true; };
    const release = e => { e.preventDefault(); if (k!==' ') keys[k]=false; };
    btn.addEventListener('pointerdown', press);
    btn.addEventListener('pointerup', release);
    btn.addEventListener('pointerleave', release);
    btn.addEventListener('pointercancel', release);
  });

  // ===== 캔버스 직접 터치: 눌러서 시작/진행 · 플로팅 조이스틱(민 방향)으로 이동 · 연타 탈출 =====
  //  절대위치가 아니라 '터치 시작점 대비 민 방향'으로 조종 → 손가락이 진행로/벌레를 안 가림.
  let stick = null;   // {ox,oy,cx,cy} 시작점(o)·현재(c) 캔버스좌표 / 안 누르면 null
  function canvasPos(e){ const r=cv.getBoundingClientRect();
    return { x:(e.clientX-r.left)/r.width*W, y:(e.clientY-r.top)/r.height*H }; }
  function canvasDown(e){ e.preventDefault(); mash++;          // 연타 탭 = 거미줄 탈출 겸용
    if(screen==='title'){ const p=canvasPos(e);                // 타이틀: 스테이지 버튼 탭하면 그 판으로
      for(const b of stageBtns()){ if(p.x>=b.x && p.x<=b.x+b.w && p.y>=b.y && p.y<=b.y+b.h){
        if(b.s<=maxCleared+1) startSelected(b.s); return; } }   // 잠긴 판은 무시
      pressAction(); return; }                                 // 버튼 밖 탭 = 기본 시작(1탄)
    if(screen!=='play'){ pressAction(); return; }              // 그 외 메뉴 탭 = 진행
    try{ cv.setPointerCapture(e.pointerId); }catch(_){}
    const p=canvasPos(e); stick={ox:p.x, oy:p.y, cx:p.x, cy:p.y}; }
  function canvasMove(e){ if(stick===null) return; e.preventDefault();
    const p=canvasPos(e); stick.cx=p.x; stick.cy=p.y; }
  function canvasUp(){ if(stick===null) return; stick=null;
    keys.ArrowUp=keys.ArrowDown=keys.ArrowLeft=keys.ArrowRight=false; }
  cv.addEventListener('pointerdown', canvasDown);
  cv.addEventListener('pointermove', canvasMove);
  cv.addEventListener('pointerup', canvasUp);
  cv.addEventListener('pointercancel', canvasUp);

  // 매 프레임: 조이스틱이 밀린 '방향'으로 방향키 입력 (벌레 위치와 무관)
  function applyTouchInput(){ if(stick===null) return;
    const dz=8, dx=stick.cx-stick.ox, dy=stick.cy-stick.oy;
    keys.ArrowLeft = dx<-dz;  keys.ArrowRight = dx>dz;
    keys.ArrowUp   = dy<-dz;  keys.ArrowDown  = dy>dz; }   // 위로 밀면=상승

  // ===== 공통 그리기 =====
  function pr(n){ return Math.round(n); }
  function rect(x,y,w,h,col){ ctx.fillStyle=col; ctx.fillRect(pr(x),pr(y),w,h); }
  function rad(d){ return d*Math.PI/180; }
  function clamp(v,a,b){ return v<a?a:v>b?b:v; }
  function line(x0,y0,x1,y1){ const c=C(); const s=Math.max(Math.abs(x1-x0),Math.abs(y1-y0))|0||1;
    for(let i=0;i<=s;i++) rect(x0+(x1-x0)*i/s, y0+(y1-y0)*i/s, 1,1, c[1]); }
  function text(str,x,y,size=8,center=false){ const c=C();
    ctx.fillStyle=c[1]; ctx.font=`${size}px 'Courier New', monospace`;
    ctx.textBaseline='top'; ctx.textAlign=center?'center':'left';
    ctx.fillText(str, pr(x), pr(y)); ctx.textAlign='left'; }
  function circleOutline(cx,cy,r){ const c=C(); const N=Math.max(10,Math.floor(r*5));
    for(let i=0;i<N;i++){ const a=(i/N)*Math.PI*2; rect(cx+Math.cos(a)*r, cy+Math.sin(a)*r,1,1,c[1]); } }
  function dashRect(x,y,w,h){ const c=C(); ctx.fillStyle=c[1];
    for(let i=0;i<w;i+=4){ ctx.fillRect(pr(x+i),pr(y),2,1); ctx.fillRect(pr(x+i),pr(y+h),2,1); }
    for(let i=0;i<h;i+=4){ ctx.fillRect(pr(x),pr(y+i),1,2); ctx.fillRect(pr(x+w),pr(y+i),1,2); } }
  function drawLeaf(bx,by,ang,len,wid){ const c=C(); const N=28;
    const nx=Math.cos(ang+Math.PI/2), ny=Math.sin(ang+Math.PI/2);
    for(let i=0;i<=N;i++){ const t=i/N, al=t*len, w=Math.sin(t*Math.PI)*wid;
      const cx=bx+Math.cos(ang)*al, cy=by+Math.sin(ang)*al;
      rect(cx+nx*w,cy+ny*w,1,1,c[1]); rect(cx-nx*w,cy-ny*w,1,1,c[1]);
      if(i%2===0) rect(cx,cy,1,1,c[1]); } }
  function drawFlower(px,py,r){ const c=C();
    for(let i=0;i<6;i++){ const a=i/6*Math.PI*2; circleOutline(px+Math.cos(a)*r, py+Math.sin(a)*r, r*0.55); }
    circleOutline(px,py,r*0.5); }
  function overlay(){ const c=C(); ctx.globalAlpha=0.6; rect(0,0,W,H,c[0]); ctx.globalAlpha=1; }

  // 러브버그
  function drawBug(px,py,flapUp,hurt){ const c=C(); const wy=flapUp?-2:1;
    rect(px-6,py-3+wy,5,4,c[1]); rect(px-5,py-2+wy,3,2,c[0]);
    rect(px+3,py-3+wy,5,4,c[1]); rect(px+4,py-2+wy,3,2,c[0]);
    const body=(hurt>0 && Math.floor(hurt*20)%2===0)?c[0]:c[1];
    rect(px-2,py-3,5,8,body); rect(px-3,py-1,7,4,body);
    rect(px-1,py,1,1,c[0]); rect(px+1,py,1,1,c[0]); rect(px,py+1,1,1,c[0]);
    rect(px-1,py-5,1,1,c[1]); rect(px+1,py-5,1,1,c[1]); rect(px-1,py-4,3,1,c[1]);
    rect(px-2,py-7,1,2,c[1]); rect(px+2,py-7,1,2,c[1]); }
  function drawSpider(px,py){ const c=C();
    rect(px-6,py,3,1,c[1]); rect(px+3,py,3,1,c[1]);
    rect(px-5,py-3,2,1,c[1]); rect(px+3,py-3,2,1,c[1]);
    rect(px-5,py+3,2,1,c[1]); rect(px+3,py+3,2,1,c[1]);
    rect(px-3,py-3,6,6,c[1]); rect(px-2,py-4,4,8,c[1]);
    rect(px-2,py-2,1,1,c[0]); rect(px+1,py-2,1,1,c[0]); }
  function drawAnt(px,py){ const c=C();
    rect(px-4,py-1,3,2,c[1]); rect(px,py-1,2,2,c[1]); rect(px+3,py-2,3,3,c[1]);
    rect(px+5,py-4,1,1,c[1]); rect(px+6,py-5,1,1,c[1]);
    rect(px-2,py+1,1,2,c[1]); rect(px,py+1,1,2,c[1]); rect(px+2,py+1,1,2,c[1]);
    rect(px-2,py-2,1,1,c[1]); rect(px+1,py-2,1,1,c[1]); }
  function drawBird(px,py){
    rect(px-3,py-1,6,3,C()[1]); rect(px-1,py-2,3,5,C()[1]);
    line(px-3,py,px-15,py-7); line(px-3,py+1,px-15,py-2);
    line(px+3,py,px+15,py-7); line(px+3,py+1,px+15,py-2);
    rect(px+3,py,2,1,C()[1]); }
  function drawChevron(x,y,up){ const c=C();
    if(up){ rect(x,y-2,1,1,c[1]); rect(x-1,y-1,1,1,c[1]); rect(x+1,y-1,1,1,c[1]); rect(x-2,y,1,1,c[1]); rect(x+2,y,1,1,c[1]); }
    else  { rect(x-2,y-2,1,1,c[1]); rect(x+2,y-2,1,1,c[1]); rect(x-1,y-1,1,1,c[1]); rect(x+1,y-1,1,1,c[1]); rect(x,y,1,1,c[1]); } }
  function drawHeart(cx,cy,col){ const P=[[-2,-2],[-1,-2],[1,-2],[2,-2],
    [-3,-1],[-2,-1],[-1,-1],[0,-1],[1,-1],[2,-1],[3,-1],
    [-3,0],[-2,0],[-1,0],[0,0],[1,0],[2,0],[3,0],
    [-2,1],[-1,1],[0,1],[1,1],[2,1],[-1,2],[0,2],[1,2],[0,3]];
    for(const [dx,dy] of P) rect(cx+dx,cy+dy,1,1,col); }
  function drawWeb(sx,y,w,h){ const cx=sx+w/2, cy=y+h/2;
    const pts=[[sx,y],[cx,y],[sx+w,y],[sx+w,cy],[sx+w,y+h],[cx,y+h],[sx,y+h],[sx,cy]];
    for(const [px,py] of pts) line(cx,cy,px,py);
    for(const f of [0.45,0.8]){ const q=pts.map(([px,py])=>[cx+(px-cx)*f,cy+(py-cy)*f]);
      for(let i=0;i<q.length;i++){ const a=q[i],b=q[(i+1)%q.length]; line(a[0],a[1],b[0],b[1]); } } }
  function drawEgg(px,py,t){ const c=C(); const sh=(t<0.6)?Math.sin(perf/40)*2:0;
    rect(px-4+sh,py-6,8,12,c[1]); rect(px-3+sh,py-7,6,14,c[1]); rect(px-5+sh,py-4,10,8,c[1]);
    rect(px-2+sh,py-3,1,1,c[0]); rect(px+1+sh,py,1,1,c[0]); rect(px-1+sh,py+3,1,1,c[0]);
    if(t<0.7){ rect(px+sh,py-6,1,4,c[0]); rect(px-1+sh,py-2,3,1,c[0]); rect(px+1+sh,py,1,3,c[0]); }
    text('부화 중...', px, py-20, 7, true); }

  // ===== 공통 이펙트 =====
  let particles=[], floats=[], shake=0, flash=0;
  function spawnParticle(x,y,up){ particles.push({x,y,vx:(Math.random()*2-1)*40,
    vy:up?-(20+Math.random()*30):(Math.random()*2-1)*40, life:0.4+Math.random()*0.4}); }
  function addFloat(x,y,txt){ floats.push({x,y,txt,life:1.0}); }
  function updateEffects(dt){
    for(const p of particles){ p.x+=p.vx*dt; p.y+=p.vy*dt; p.life-=dt; }
    particles=particles.filter(p=>p.life>0);
    for(const f of floats){ f.y-=dt*16; f.life-=dt; }
    floats=floats.filter(f=>f.life>0);
    if(shake>0) shake-=dt; if(flash>0) flash-=dt;
  }
  function drawEffects(){ const c=C();
    for(const p of particles) rect(p.x,p.y,1,1,c[1]);
    for(const f of floats) text(f.txt, f.x, f.y, 8, true); }

  // ===== 엔진 / 흐름 =====
  const TIME=60, DRY_NEED=5, LOVE_GOOD=4;   // 빛 LOVE_GOOD개 이상 모으면 해피엔딩
  let screen='title', stage=1, cleared=0, loveLight=0;   // loveLight: 한 판 동안 모은 빛(사랑)
  let maxCleared=0;   // 지금까지 깬 최고 스테이지(진행도, localStorage 저장) → 스테이지 선택 해금
  try { maxCleared = +(localStorage.getItem('lovebug_cleared')||0) || 0; } catch(_){}
  let timeLeft, introT, sv={}, cur=null;

  function startNewGame(){ cleared=maxCleared; loveLight=0; startStage(1); }
  function startSelected(n){ cleared=maxCleared; loveLight=0; startStage(n); }   // 스테이지 선택
  function startStage(n){ stage=n; cur=STAGES[n]; timeLeft=cur.time; introT=1.6;
    sv={noTimer:false}; particles=[]; floats=[]; shake=0; flash=0; cur.init(); screen='play'; }
  function stageClear(){ cleared=Math.max(cleared,stage);
    if(stage>maxCleared){ maxCleared=stage; try{ localStorage.setItem('lovebug_cleared',maxCleared); }catch(_){} }
    flash=0.3; screen='cleared'; }
  function stageFail(reason){ sv.failMsg=reason; screen='gameover'; }

  const INTERLUDE = {
    1: ['날개가 마르자,', '세상이 처음으로 넓어졌다.'],
    2: ['바람의 끝에서 —', '처음으로, 그 빛을 보았다.'],
    3: ['도시는 우리를 미워했다.', '그래도 나는 빛을 향해 갔다.'],
    4: ['수천의 날갯짓 속에서', '너를 알아보았다.'],
    5: ['둘이 하나 되어,', '노을 속으로.'],
  };

  // ========================================================
  //  STAGE 1 : 부화 & 등반 (세로 스크롤)
  // ========================================================
  const s1 = {
    name:'STAGE 1  부화', objective:'줄기를 올라 햇빛에서 날개 말리기', time:TIME,
    GOAL:1540, CW:42, SP:84, SPX:90,
    stemX(y){ return 80 + Math.sin(y*0.018)*34 + Math.sin(y*0.006+2.0)*14; },
    sY(wy){ return H-(wy-sv.camY); },
    goalX(){ return this.stemX(this.GOAL+16); },
    sunZone(){ const cx=this.goalX(); return {x0:cx-30,x1:cx+30,y0:this.GOAL-4,y1:this.GOAL+46}; },
    init(){ sv.camY=0; sv.dry=0; sv.phase='hatch'; sv.hatchT=1.4; sv.spawnT=4.0;
      sv.enemies=[]; sv.noTimer=true;
      sv.bug={x:this.stemX(6), worldY:6, vx:0, vy:0, hurt:0, flap:0}; },
    update(dt){
      const b=sv.bug;
      if(sv.phase==='hatch'){ sv.hatchT-=dt;
        if(sv.hatchT<=0){ sv.phase='play'; sv.noTimer=false; for(let i=0;i<10;i++) spawnParticle(b.x,this.sY(b.worldY)); }
        return; }
      let mvx=0,mvy=0;
      if(keys.ArrowRight)mvx+=1; if(keys.ArrowLeft)mvx-=1;
      if(keys.ArrowUp)mvy+=1; if(keys.ArrowDown)mvy-=1;
      b.vx+=(mvx*this.SPX-b.vx)*0.25; b.vy+=(mvy*this.SP-b.vy)*0.25;
      b.x+=b.vx*dt; b.worldY+=b.vy*dt;
      b.worldY=clamp(b.worldY, sv.camY, this.GOAL+60);
      const sx=this.stemX(b.worldY);
      b.x=clamp(b.x, sx-this.CW, sx+this.CW); b.x=clamp(b.x,8,W-8);
      b.flap+=dt*7; if(b.hurt>0)b.hurt-=dt;
      const CAM_TOP=this.GOAL-172;
      sv.camY=Math.max(sv.camY, Math.min(b.worldY-0.42*H, CAM_TOP));
      const z=this.sunZone();
      if(b.x>z.x0&&b.x<z.x1&&b.worldY>z.y0&&b.worldY<z.y1){
        sv.dry+=dt; if(Math.random()<0.3) spawnParticle(b.x+(Math.random()*8-4), this.sY(b.worldY)-4, true);
        if(sv.dry>=DRY_NEED){ stageClear(); return; } }
      sv.spawnT-=dt;
      if(sv.spawnT<=0){ sv.spawnT=Math.max(2.4,4.0-(TIME-timeLeft)*0.02);
        if(sv.enemies.length<2){ const wy=sv.camY+H+8, cx=this.stemX(wy);
          sv.enemies.push({x:cx+(Math.random()*2-1)*this.CW*0.7, worldY:wy, sp:16+Math.random()*12,
            side:0.6+Math.random()*0.5, seed:Math.random()*10, life:12}); } }
      for(const e of sv.enemies){ e.worldY-=e.sp*dt; const cx=this.stemX(e.worldY);
        e.x+=clamp(b.x-e.x,-1,1)*e.side*dt*10 + Math.sin(perf/220+e.seed)*0.4;
        e.x=clamp(e.x,cx-this.CW,cx+this.CW); e.life-=dt;
        if(b.hurt<=0 && Math.hypot(e.x-b.x,e.worldY-b.worldY)<8){

      if(!(b.hurt>0 && Math.floor(perf/60)%2===0)) drawBug(b.x,b.y,Math.floor(b.flap)%2===0,b.hurt);
      drawEffects(); drawTimer();
      const bx=34,bw=104; rect(bx,4,bw,6,c[1]); rect(bx+1,5,bw-2,4,c[0]); rect(bx+1,5,Math.round((bw-2)*Math.min(1,sv.worldX/this.GOAL)),4,c[1]); rect(bx+bw-3,3,3,8,c[1]);
      text('♥'+loveLight, W-15, 3, 7); },
  };

  // ========================================================
  //  STAGE 4 : 군무 (수천 속에서 짝찾기) — 자유 이동, 하트 신호 주는 짝 찾기
  // ========================================================
  const s4 = {
    name:'STAGE 4  군무', objective:'하트 신호를 주는 너를 찾아', time:TIME, ACC:320, DRG:5,
    init(){ sv.noTimer=false; sv.bug={x:W/2,y:H/2,vx:0,vy:0,flap:0,hurt:0};
      sv.crowd=[]; const N=15;
      for(let i=0;i<N;i++) sv.crowd.push({x:16+Math.random()*(W-32), y:22+Math.random()*(H-44),
        vx:(Math.random()*2-1)*12, vy:(Math.random()*2-1)*12, seed:Math.random()*10});
      sv.crowd[(Math.random()*N)|0].real=true; },
    update(dt){ const b=sv.bug;
      if(keys.ArrowLeft)b.vx-=this.ACC*dt; if(keys.ArrowRight)b.vx+=this.ACC*dt;
      if(keys.ArrowUp)b.vy-=this.ACC*dt; if(keys.ArrowDown)b.vy+=this.ACC*dt;
      b.vx-=b.vx*this.DRG*dt; b.vy-=b.vy*this.DRG*dt; b.vx=clamp(b.vx,-115,115); b.vy=clamp(b.vy,-115,115);
      b.x=clamp(b.x+b.vx*dt,10,W-10); b.y=clamp(b.y+b.vy*dt,16,H-10); b.flap+=dt*7; if(b.hurt>0)b.hurt-=dt;
      for(const m of sv.crowd){ m.x+=m.vx*dt; m.y+=m.vy*dt;
        if(m.x<10||m.x>W-10){m.vx*=-1;m.x=clamp(m.x,10,W-10);} if(m.y<16||m.y>H-10){m.vy*=-1;m.y=clamp(m.y,16,H-10);}
        const d=Math.hypot(m.x-b.x,m.y-b.y);
        if(d<9){ if(m.real){ for(let i=0;i<16;i++) spawnParticle(b.x,b.y,true); addFloat(b.x,b.y-14,'너다!'); stageClear(); return; }
          else if(b.hurt<=0){ b.hurt=0.8; timeLeft=Math.max(0,timeLeft-1.0); shake=0.25; b.vx=-b.vx;b.vy=-b.vy; addFloat(m.x,m.y-12,'아냐…'); } } }
      sv.bugSX=b.x; sv.bugSY=b.y; },
    render(){ const c=C(); const b=sv.bug; rect(0,0,W,H,c[0]);
      for(const m of sv.crowd){ drawBug(m.x,m.y,(Math.floor(perf/150+m.seed)%2===0),0);
        if(m.real && Math.floor(perf/450)%2===0) drawHeart(m.x,m.y-9,c[1]); }         // 진짜 짝의 하트 신호
      circleOutline(b.x,b.y,7);                                                       // 플레이어 표식(고리)
      drawBug(b.x,b.y,Math.floor(b.flap)%2===0,b.hurt);
      drawEffects(); drawTimer();
      if(Math.floor(perf/500)%2===0) text('♥ 신호를 찾아', W/2, 3, 7, true); },
  };

  // ========================================================
  //  STAGE 5 : 노을 듀엣 (피날레) — 짝 곁에 머물러 함께 날기
  // ========================================================
  const s5 = {
    name:'STAGE 5  노을', objective:'둘이 함께, 노을 속으로', time:TIME,
    init(){ sv.noTimer=false; sv.bug={x:60,y:140,vy:0,flap:0,hurt:0}; sv.mateX=94; sv.t=0; sv.together=0; sv.mateY=120; },
    update(dt){ const b=sv.bug; sv.t+=dt; sv.mateY=128+Math.sin(sv.t*0.8)*44;
      b.vy+=70*dt; if(keys.ArrowUp)b.vy-=280*dt; if(keys.ArrowDown)b.vy+=200*dt;
      b.vy-=b.vy*2.6*dt; b.vy=clamp(b.vy,-120,110); b.y+=b.vy*dt;
      if(b.y<18){b.y=18;if(b.vy<0)b.vy=0;} if(b.y>H-14){b.y=H-14;if(b.vy>0)b.vy=0;}
      if(keys.ArrowLeft)b.x-=90*dt; if(keys.ArrowRight)b.x+=90*dt; b.x=clamp(b.x,20,120); b.flap+=dt*7;
      const d=Math.hypot(sv.mateX-b.x, sv.mateY-b.y);
      if(d<32){ sv.together=Math.min(1,sv.together+dt/7); if(Math.random()<0.15) addFloat(b.x+(Math.random()*16-8),b.y-6,'♥'); }
      else sv.together=Math.max(0,sv.together-dt*0.3);
      sv.bugSX=b.x; sv.bugSY=b.y;
      if(sv.together>=1){ for(let i=0;i<22;i++) spawnParticle((b.x+sv.mateX)/2,(b.y+sv.mateY)/2,true);
        loveLight=Math.max(loveLight,LOVE_GOOD); addFloat((b.x+sv.mateX)/2,b.y-16,'사랑!'); stageClear(); return; } },
    render(){ const c=C(); const b=sv.bug; rect(0,0,W,H,c[0]);
      // 노을: 가라앉는 큰 해 + 해에서 퍼지는 촘촘→성긴 가로 글로우(디더) + 수평선
      const cx=W/2, cy=110;
      for(let yy=16; yy<H-18; yy+=2){ const d=Math.abs(yy-cy), gap=4+((d/7)|0);
        for(let xx=(yy%4); xx<W; xx+=gap) if(Math.hypot(xx-cx,yy-cy)>33) rect(xx,yy,1,1,c[1]); }
      for(const r of [33,26,19,12]) circleOutline(cx,cy,r);                           // 해 동심원
      rect(0,H-16,W,1,c[1]); for(let x=2;x<W;x+=7) rect(x,H-18,1,2,c[1]);              // 수평선
      drawBug(sv.mateX, sv.mateY, Math.floor(perf/150)%2===0, 0);
      if(Math.floor(perf/300)%2===0) circleOutline(sv.mateX,sv.mateY,8);
      drawBug(b.x,b.y,Math.floor(b.flap)%2===0,0);
      drawEffects(); drawTimer();
      const gw=100,gx=(W-gw)/2; rect(gx,H-12,gw,5,c[1]); rect(gx+1,H-11,gw-2,3,c[0]); rect(gx+1,H-11,Math.round((gw-2)*sv.together),3,c[1]);
      text('함께', W/2, H-22, 7, true); },
  };

  const STAGES = { 1:s1, 2:s2, 3:s3, 4:s4, 5:s5 };

  // 타이틀 스테이지 선택 버튼 좌표 (렌더/터치 공용). 해금: s <= maxCleared+1
  function stageBtns(){ const ss=Object.keys(STAGES).map(Number).sort((a,b)=>a-b);
    const bw=20, gap=7, h=22, y=136, tot=ss.length*bw+(ss.length-1)*gap, x0=Math.round((W-tot)/2);
    return ss.map((s,i)=>({ s, x:x0+i*(bw+gap), y, w:bw, h })); }

  // ===== 공통 HUD / 화면 =====
  function drawTimer(){ const c=C(); rect(0,0,W,13,c[0]); rect(0,13,W,1,c[1]);
    const t=Math.max(0,Math.ceil(timeLeft));
    text('T',3,3,8); ctx.fillStyle=(t<=10 && Math.floor(perf/250)%2===0)?c[0]:c[1];
    ctx.font="8px 'Courier New', monospace"; ctx.fillText(String(t).padStart(2,'0'),12,3);
    // 위 게이지는 각 스테이지가 rect(...,13...) 위에 그림; 타이머만 여기서
  }
  function drawBeacon(x,y){ const c=C(); text('사랑까지', x-24, y-10, 7, true);
    for(let i=0;i<5;i++){ const bx=x-24+i*10; if(i<cleared){ rect(bx,y,7,4,c[1]); } else dashRect(bx,y,6,3); }
    text('♥', x+34, y-2, 8); }

  // ===== 루프 =====
  let last=performance.now(), perf=last;
  function loop(now){ const dt=Math.min(0.05,(now-last)/1000); last=now; perf=now;
    if(screen==='play'){
      if(introT>0) introT-=dt;
      else { if(!sv.noTimer){ timeLeft-=dt; if(timeLeft<=0) stageFail('시간 초과... 날개가 마르지 못했다'); }
        if(screen==='play'){ applyTouchInput(); cur.update(dt); } }
      updateEffects(dt);
    }
    render(); requestAnimationFrame(loop);
  }

  function render(){ const c=C();
    ctx.save(); if(shake>0) ctx.translate((Math.random()*2-1)*3,(Math.random()*2-1)*3);

    if(screen==='title'){ rect(0,0,W,H,c[0]);
      text('L O V E B U G', W/2, 38, 14, true);
      text('러브버그의 사랑', W/2, 58, 8, true);
      drawBug(W/2, 92, Math.floor(perf/150)%2===0, 0);
      text('STAGE 선택', W/2, 120, 7, true);
      for(const btn of stageBtns()){ const unlocked=btn.s<=maxCleared+1, done=btn.s<=maxCleared;
        if(unlocked){ rect(btn.x,btn.y,btn.w,btn.h,c[1]); rect(btn.x+1,btn.y+1,btn.w-2,btn.h-2,c[0]);
          text(String(btn.s), btn.x+btn.w/2, btn.y+4, 11, true);
          if(done) text('★', btn.x+btn.w/2, btn.y+btn.h-8, 6, true); }   // 클리어 표식
        else dashRect(btn.x,btn.y,btn.w,btn.h); }                        // 잠김(점선)
      if(Math.floor(perf/500)%2===0) text('▶ 번호 탭해서 시작', W/2, 168, 8, true);
      text('짧은 생, 오직 사랑을 찾아서', W/2, 190, 7, true);
      text('끌기/방향키 이동 · C 색', W/2, 206, 7, true);
      ctx.restore(); return; }

    // 플레이/클리어/실패는 현재 스테이지 화면을 바탕에 그림
    if(cur) cur.render();

    if(screen==='play' && introT>0){ overlay();
      text(cur.name, W/2, 108, 12, true); text(cur.objective, W/2, 128, 8, true); }

    if(screen==='cleared'){ overlay();
      const t=INTERLUDE[stage]||['...','...'];
      text('★ CLEAR ★', W/2, 70, 12, true);
      text(t[0], W/2, 104, 8, true); text(t[1], W/2, 118, 8, true);
      drawBeacon(W/2, 150);
      if(Math.floor(perf/500)%2===0) text('SPACE ▶', W/2, 186, 9, true); }

    if(screen==='gameover'){ overlay();
      text('GAME OVER', W/2, 96, 14, true);
      text(sv.failMsg||'', W/2, 122, 7, true);
      if(Math.floor(perf/500)%2===0) text('SPACE 다시', W/2, 150, 9, true); }

    if(screen==='ending'){ overlay();
      const good = loveLight>=LOVE_GOOD;   // 모은 빛에 따라 엔딩 분기
      if(good){ text('둘이 하나 되어,', W/2, 82, 10, true);
        text('노을 속으로.', W/2, 102, 9, true);
        drawHeart(W/2-7,130,c[1]); drawHeart(W/2+7,130,c[1]); }
      else { text('빛은 옅었지만,', W/2, 82, 10, true);
        text('끝까지 사랑을 향해 날았다.', W/2, 102, 8, true);
        drawHeart(W/2,130,c[1]); }
      text('모은 빛  ♥ × '+loveLight, W/2, 152, 7, true);
      if(Math.floor(perf/500)%2===0) text('SPACE ▶', W/2, 176, 9, true); }

    if(flash>0){ ctx.globalAlpha=flash*2; rect(0,0,W,H,c[1]); ctx.globalAlpha=1; }
    ctx.restore();

    // 플로팅 조이스틱 표시 (터치 중에만): 시작점 고리 + 민 방향 손잡이
    if(stick && screen==='play'){ circleOutline(stick.ox, stick.oy, 12);
      const dx=stick.cx-stick.ox, dy=stick.cy-stick.oy, m=Math.hypot(dx,dy)||1, k=Math.min(12,m)/m;
      rect(stick.ox+dx*k-1, stick.oy+dy*k-1, 3,3, c[1]); }
  }

  requestAnimationFrame(loop);
})();
</script>
</body>
