<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ARCADE</title>
<style>
  html,body{margin:0;height:100%;background:#0b0f0b;color:#9bbc0f;
    font-family:'Courier New',monospace;display:flex;align-items:center;justify-content:center;}
  .wrap{text-align:center;}
  h1{letter-spacing:6px;font-size:34px;margin:0 0 6px;}
  p.sub{color:#4a6b4a;letter-spacing:2px;margin:0 0 32px;}
  a.card{display:block;width:260px;margin:0 auto;padding:18px;text-decoration:none;
    color:#9bbc0f;border:2px solid #306230;border-radius:10px;background:#0f1a0f;
    transition:transform .1s, background .1s;}
  a.card:hover{background:#16240f;transform:translateY(-2px);}
  a.card .t{font-size:20px;letter-spacing:3px;}
  a.card .d{color:#4a6b4a;font-size:12px;margin-top:6px;}
</style>
</head>
<body>
  <div class="wrap">
    <h1>ARCADE</h1>
    <p class="sub">픽셀 미니게임 모음</p>
    <a class="card" href="./lovebug/">
      <div class="t">LOVEBUG</div>
      <div class="d">러브버그의 사랑 · 짧은 생, 오직 사랑을 찾아서</div>
    </a>
  </div>
</body>
</html>
